openapi: 3.0.2
info:
  title: Planr
  version: v1
  contact:
    email: support@skedulo.com
servers:
  - url: https://api.skedulo.com/planr
  - url: https://api.uk.skedulo.com/planr
  - url: https://api.ca.skedulo.com/planr
  - url: https://api.au.skedulo.com/planr
security:
  - BearerAuth: []
paths:
  /optimize/suggest:
    post:
      operationId: suggest
      summary: Suggest times for a single job
      description: >
        Query the `/optimize/suggest` endpoint to find the best time to schedule
        a single job given a set of resources within a specific time range.


        For example, if a job must be done on Thursday before noon you can
        specify the time window of 8AM to 12PM on Thursday and the resources
        that are available to find the best time to schedule the job that
        morning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SuggestBodyResourceIds'
                - $ref: '#/components/schemas/SuggestBodyResources'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestResponse'
  /optimize/resource_suggestions:
    post:
      operationId: /optimize/resource_suggestions
      summary: Suggest resources for a given job
      description: >
        Find the best resources within a given time range, for a given job and
        resource availabilities.


        This query provides the amount of time each resource has available
        during the time period to complete the task.


        * Resource availability is determined by working hours, holidays,
        existing jobs, shifts, and activities.

        * You can provide availability directly (via `resources`) or by
        referencing existing resources (via `resourceIds`).

        * Capacity fields (`currentCapacityInSeconds` and
        `newCapacityInSeconds`) show how much time a resource has available
        before and after scheduling the job.


        **Availability Preferences**


        You can optionally enable Availability Preferences using the
        `useAvailabilityPreferences` flag.


        When `useAvailabilityPreferences` is set to `true`, Planr derives
        availability preferences for the job from enabled Jobs Record Filters
        and applies them when evaluating resource availability. This allows you
        to prioritise resources whose availability preferences match the job’s
        attributes.


        Behaviour when `useAvailabilityPreferences` is enabled:


        * Preferences are derived server-side from Jobs Record Filters
        associated with the given `jobId`.

        * Only filters that apply to availability preferences are considered.

        * If no relevant preferences are found for the job, the result is
        equivalent to calling the endpoint with `useAvailabilityPreferences` set
        to `false`.

        * When `useAvailabilityPreferences` is omitted or `false`, resource
        suggestions do not consider availability preferences.


        Unlike `/grid/schedule`, which accepts client-supplied
        `availabilityFilterValues`,

        this endpoint derives availability preferences automatically from Jobs
        Record Filters

        associated with the given `jobId`. The caller does not supply preference
        values directly;

        Planr evaluates the job against all relevant filters to determine which
        preferences apply.


        **Behaviour with `resources` availability window input**


        When using the resources map variant (where availability windows are
        supplied directly),

        Planr does not re-query the Availability engine, and
        useAvailabilityPreferences is ignored.

        Preference evaluation is only applied for the `resourceIds` request
        shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ResourceSuggestionBodyResourceIds'
                - $ref: '#/components/schemas/ResourceSuggestionBodyResources'
            examples:
              useAvailabilityPreferencesWithResourceIds:
                summary: Use availability preferences (resourceIds)
                value:
                  jobId: 0014cac9-4ba2-4944-b7ca-b4d2c40b1403
                  resourceIds:
                    - 0005ea18-61c1-49d9-9b50-d16a31a21c20
                    - 0005ade1-2a42-431f-a468-594ec4cb3261
                  scheduleStart: '2025-06-26T22:00:00.000Z'
                  scheduleEnd: '2025-06-27T04:00:00.000Z'
                  schedulingOptions:
                    jobTimeAsTimeConstraint: true
                    respectSchedule: true
                  regionId: 0005ea18-61c1-49d9-9b50-d16a31a21c20
                  useAvailabilityPreferences: true
              useAvailabilityWithClientProvidedAvailabilityWindows:
                summary: >-
                  Use availability with client provided resource availability
                  windows
                value:
                  jobId: 0014cac9-4ba2-4944-b7ca-b4d2c40b1403
                  resources:
                    0005ea18-61c1-49d9-9b50-d16a31a21c20:
                      - start: '2025-06-26T22:00:00.000Z'
                        end: '2025-06-27T04:00:00.000Z'
                    0005ade1-2a42-431f-a468-594ec4cb3261:
                      - start: '2025-06-26T23:00:00.000Z'
                        end: '2025-06-27T03:00:00.000Z'
                  scheduleStart: '2025-06-26T22:00:00.000Z'
                  scheduleEnd: '2025-06-27T04:00:00.000Z'
                  schedulingOptions:
                    jobTimeAsTimeConstraint: true
                    respectSchedule: true
                  regionId: 0005ea18-61c1-49d9-9b50-d16a31a21c20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSuggestionResponse'
              examples:
                preferencesEnabledExample:
                  summary: Availability preferences enabled (resource filtered out)
                  value:
                    result:
                      0005ce31-b45d-4b68-8c0a-eeed9ce82dfb:
                        resourceId: 0005ce31-b45d-4b68-8c0a-eeed9ce82dfb
                        allTagsUnmet: false
