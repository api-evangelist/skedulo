  /grid/schedule:
    post:
      operationId: /grid/schedule
      summary: Resource availability for a rolling timeframe
      description: >
        Splits a given time window into a sequence of slots at a specified
        interval of size "gridSize"; then aggregates resource availability into
        it, against the given job. Availability is determined by working hours,
        holidays, existing jobs and activities. Resource must be available for
        the entire duration of the slot to be returned in the list.


        Use the `/grid/schedule` endpoint to find all of the available time
        slots for a job to be completed during a specified time window. For
        example, if a job must be completed by the close of business the
        following day, you can query the `/grid/schedule` endpoint to obtain an
        aggregate of resource availability between now and tomorrow afternoon at
        5PM.


        The query splits the time window into intervals to determine which
        resources are available at different times during the time window for
        the job.


        * Resource availability is determined by working hours, holidays,
        existing jobs, shifts, and activities.

        * Resources must be available for the entire duration of the job slot to
        be returned in the list.

        * You can further filter resource availability based on job attributes
        (such as job type, urgency, or custom fields) using the
        `availabilityFilterValues` parameter, which matches these attributes
        against resource availability preferences.


        **Availability Preferences**


        You can filter resource availability based on preferences attached to a
        resource's availability pattern using one of two mutually exclusive
        options:


        * `availabilityFilterValues` — client-supplied filter definitions
        (attribute values to match against)

        * `availabilityFilterEntityIds` — entity IDs that the server uses to
        derive filter criteria automatically


        Only one of these may be provided per request. If both are supplied, the
        request is rejected.


        **Option 1: `availabilityFilterValues` (client-supplied)**


        Specify the `objectType` (typically "Jobs") and provide a dictionary of
        attributes in the `values` field that represent the job requirements.
        The API will filter available resources to only include those whose
        preferences match the specified values.


        Example:

        ```json

        "availabilityFilterValues": [
          {
            "objectType": "Jobs",
            "values": {
              "Type": "Maintenance",
              "Urgency": "Critical"
            }
          }
        ]

        ```


        In this example, only resources who have preferences matching
        "Maintenance" jobs with "Critical" urgency will be included in the
        availability results.


        Using `availabilityFilterValues`:

        - You can include multiple filters for different `objectType` values in
        one request.

        - Only the first filter for each `objectType` will be used; combine all
        criteria into a single filter for each type.

        - Extra fields in `values` are ignored if they are not referenced in any
        Availability Preference Filter Expression.

        - Multiple fields in `values` are combined with AND logic; array values
        act like OR conditions.

        - All `objectType` and field names must exist in your schema.


        **Option 2: `availabilityFilterEntityIds` (server-derived)**


        Instead of supplying filter values directly, provide a map of entity
        types to entity IDs. The server derives the appropriate filter criteria
        from the referenced entities (e.g., evaluating a Job's attributes
        against all relevant Record Filters).


        Example:

        ```json

        "availabilityFilterEntityIds": {
          "Jobs": ["0014cac9-4ba2-4944-b7ca-b4d2c40b1403"]
        }

        ```


        In this example, the server evaluates the specified job against
        available Record Filters and applies any matching filters to resource
        availability. The total number of entity IDs across all types cannot
        exceed 50.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              allOf:
                - oneOf:
                    - $ref: '#/components/schemas/SchedulingGridBodyResourceIds'
                    - $ref: '#/components/schemas/SchedulingGridBodyResources'
                - type: object
                  properties:
                    explain:
                      $ref: '#/components/schemas/SchedulingGridExplain'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingGridResponse'
              examples:
                explainDisabled:
                  summary: Explain disabled (default)
                  value:
                    result:
                      - start: '2025-06-26T22:00:00Z'
                        end: '2025-06-26T22:05:00Z'
                        availableResources:
                          - R1
                          - R2
                explainEnabledPerResourceIds:
                  summary: Explain enabled with distinct per-resource explanationIds
                  value:
                    result:
                      - start: '2025-06-26T22:00:00Z'
                        end: '2025-06-26T22:05:00Z'
                        availableResources:
                          - R1
                          - R2
                        explainRef:
                          R1: e_AAAAAAAAEEEEEEEE
                          R2: e_BBBBBBBBFFFFFFFF
                    metadata:
                      explanationsById:
                        e_AAAAAAAAEEEEEEEE:
                          matchedGroups:
                            - objectType: Jobs
                              groupId: job-1
                              matched:
                                - attr: Type
                                  expected:
                                    - Maintenance
                              matchedRecordFilterIds:
                                - 004257ca-0000
                          contributors:
                            - entity: AvailabilityPatterns
                              id: pat-123
                              isAvailable: true
                              start: '2025-06-26T22:00:00Z'
                              end: '2025-06-26T22:10:00Z'
                              precedence: 1
                              extra:
                                patternType: Weekly
                                availabilityType: Availability
                                matchedRecordFilterIds:
                                  - 004257ca-0000
                        e_BBBBBBBBFFFFFFFF:
                          matchedGroups:
                            - objectType: Jobs
                              groupId: job-2
                              matched:
                                - attr: Type
                                  expected:
                                    - Maintenance
                          contributors:
                            - entity: AvailabilityPatterns
                              id: pat-456
                              isAvailable: true
                              start: '2025-06-26T22:00:00Z'
                              end: '2025-06-26T22:10:00Z'
                              precedence: 1
                              extra:
                                patternType: Weekly
                                availabilityType: Availability
                      preferences:
                        recordFiltersById:
                          004257ca-0000:
                            name: RF-0001
                            expression: Type == 'Maintenance'
                            objectType: Jobs
  /geoservices/travel-time:
    post:
      operationId: /geoservices/travel-time
      summary: >-
        Determine travel time for many resources, across work or activities they
        have been assigned
      description: >-
        The Travel Time endpoint will approximate how long it takes for a
        resource to travel between destinations. It will filter down to relevant
        availability windows (ignoring destinations outside the resource's
        availability), order the work to be completed, and finally calculate the
        travel time between each destination. The result will contain only the
        node identifier and the relevant travel time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelTimeBody'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelTimeResponse'
components:
  schemas:
    SuggestBodyResourceIds:
      type: object
      properties:
        suggestForNode:
          type: string
          description: ID of the job that you want the suggestion for.
        resourceIds:
          type: array
          items:
            type: string
        scheduleStart:
          $ref: '#/components/schemas/TimeStamp'
        scheduleEnd:
          $ref: '#/components/schemas/TimeStamp'
        schedulingOptions:
          $ref: '#/components/schemas/SchedulingOptions'
        accountResourceScores:
          type: array
          description: An array of accounts and resources to blacklist
          items:
            $ref: '#/components/schemas/AccountResourceScores'
        regionId:
          type: string
          description: >
            Resource availability will be based on when resources are available
            in the region specified.  Availability depends

            on the primary region of the resource or whether the resource has
            Temporary or Secondary regions assigned.
      required:
        - suggestForNode
        - resourceIds
        - scheduleStart
        - scheduleEnd
    SuggestBodyResources:
      type: object
      properties:
        suggestForNode:
          type: string
          description: ID of the job that you want the suggestion for.
        resources:
          description: A map of availability windows for each resource.
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                start:
                  $ref: '#/components/schemas/TimeStamp'
                end:
                  $ref: '#/components/schemas/TimeStamp'
        scheduleStart:
          $ref: '#/components/schemas/TimeStamp'
        scheduleEnd:
          $ref: '#/components/schemas/TimeStamp'
        schedulingOptions:
          $ref: '#/components/schemas/SchedulingOptions'
        accountResourceScores:
          type: array
          description: An array of accounts and resources to blacklist
          items:
            $ref: '#/components/schemas/AccountResourceScores'
        regionId:
          type: string
          description: >
            Resource availability will be based on when resources are available
            in the region specified.  Availability depends

            on the primary region of the resource or whether the resource has
            Temporary or Secondary regions assigned.
      required:
        - suggestForNode
        - resources
        - scheduleStart
        - scheduleEnd
    SuggestResponse:
      type: object
      example: |
        {
          "result": {
            "routes": {
              "0005ea18-61c1-49d9-9b50-d16a31a21c20": {
                "resourceId": "0005ea18-61c1-49d9-9b50-d16a31a21c20",
                "route": {
                  "jobId": "0014cac9-4ba2-4944-b7ca-b4d2c40b1403",
                  "jobName": "JOB-0225",
                  "start": "2018-09-03T23:21:00.000Z",
                  "duration": 40,
                  "travelTime": 21,
                  "type": "job"
                },
                "gapList": [
                  {
                    "fromPrev": {
                      "travelTime": 21
                    },
                    "interval": {
                      "start": "2018-09-03T23:21:00.000Z",
                      "end": "2018-09-04T00:01:00.000Z"
                    },
                    "toNext": {
                      "travelTime": 0
                    }
                  }
                ],
                "isAllocated": false
              }
            }
          }
        }
      properties:
        result:
          type: object
          properties:
            routes:
              type: object
              additionalProperties:
                type: object
                properties:
                  resourceId:
                    type: string
                    description: Id of the resource this suggestion is related to.
                  isAllocated:
                    type: boolean
                    description: >-
                      Flag that signifies whether this resource has already been
                      allocated to the job.
                  route:
                    type: object
                    properties:
                      duration:
                        type: integer
                        description: Duration ( in minutes ) of the current job.
                      jobId:
                        type: string
                        description: Id of the current job.
                      jobName:
                        type: string
                        description: Name of the current job ( Job.Name ).
                      start:
                        type: string
                        format: date-time
                        description: >-
                          Suggested start time of the job as an ISO8601 Date
                          Time string.
                      travelTime:
                        type: integer
                        description: >-
                          Travel time ( in minutes ) from the previous location
                          ( resource home or previous job ) to the current job.
                      type:
                        type: string
    ResourceSuggestionBodyResources:
      type: object
      properties:
        jobId:
          type: string
          description: UID of the job that you want the suggestion for.
        resources:
          description: >
            Use client-provided availability windows for each resource.

            When using this form, Planr does not re-fetch availability from the
            Availability engine;

            useAvailabilityPreferences is ignored.
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                start:
                  $ref: '#/components/schemas/TimeStamp'
                end:
                  $ref: '#/components/schemas/TimeStamp'
        scheduleStart:
          $ref: '#/components/schemas/TimeStamp'
        scheduleEnd:
          $ref: '#/components/schemas/TimeStamp'
        schedulingOptions:
          $ref: '#/components/schemas/SchedulingOptions'
        accountResourceScores:
          type: array
          description: An array of accounts and resources to blacklist
          items:
            $ref: '#/components/schemas/AccountResourceScores'
        regionId:
          type: string
          description: >
            Resource availability will be based on when resources are available
            in the region specified. Availability depends

            on the primary region of the resource or whether the resource has
            Temporary or Secondary regions assigned.
        useAvailabilityPreferences:
          type: boolean
          default: false
          description: >
            Automatic availability preference evaluation is only available when
            using the `resourceIds` request

            shape. When using the `resources` map variant, preference evaluation
            is always disabled.
      required:
        - jobId
        - resources
        - scheduleStart
        - scheduleEnd
    ResourceSuggestionBodyResourceIds:
      type: object
      properties:
        jobId:
          type: string
          description: UID of the job that you want the suggestion for.
        resourceIds:
          type: array
          items:
            type: string
        scheduleStart:
          $ref: '#/components/schemas/TimeStamp'
        scheduleEnd:
          $ref: '#/components/schemas/TimeStamp'
        schedulingOptions:
          $ref: '#/components/schemas/SchedulingOptions'
        accountResourceScores:
          type: array
          description: An array of accounts and resources to blacklist
          items:
            $ref: '#/components/schemas/AccountResourceScores'
        regionId:
          type: string
          description: >
            Resource availability will be based on when resources are available
            in the region specified. Availability depends

            on the primary region of the resource or whether the resource has
            Temporary or Secondary regions assigned.
        useAvailabilityPreferences:
          type: boolean
          default: false
          description: >
            When true, derive and apply availability preferences for the given
            job using Jobs Availability Preferences.

            Only resources whose availability matches the derived preferences
            are considered when suggesting resources.

            If omitted or false, resource suggestions do not consider
            availability preferences.

            If no relevant preferences are found for the job, this flag has no
            effect.
      required:
        - jobId
        - resourceIds
        - scheduleStart
        - scheduleEnd
    ExceptionOptions:
      type: object
      properties:
        ignoreTravelTimes:
          type: boolean
          default: false
          description: Ignore all travel times between resources and jobs.
        ignoreTravelTimeFirstJob:
          type: boolean
          default: false
          description: Ignore travel time from a resource' home location to the first job.
        ignoreTravelTimeLastJob:
          type: boolean
          default: false
          description: Ignore travel time to the resource' home location from the last job.
    MinShiftInterval:
      type: object
      properties:
        type:
          type: string
          enum:
            - min-shift-interval
        timeBetweenShifts:
          type: integer
          description: The minimum number of minutes between shifts
    ResourceExceptionBody:
      type: object
      properties:
        resourceId:
          type: string
          description: UID of the resource to find exceptions for.
        start:
          $ref: '#/components/schemas/TimeStamp'
        end:
          $ref: '#/components/schemas/TimeStamp'
        options:
          $ref: '#/components/schemas/ExceptionOptions'
        fatigueRuleCriteria:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/MinShiftInterval'
      required:
        - resourceId
        - start
        - end
    ResourceExceptionResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            travelTimes:
              type: object
              additionalProperties:
                type: number
            exceptions:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/NodeOverlapException'
                  - $ref: '#/components/schemas/InsufficientTravelTimeException'
                  - $ref: '#/components/schemas/AvailabilityOverlapException'
                  - $ref: '#/components/schemas/TimeConstraintException'
                  - $ref: '#/components/schemas/TagException'
                  - $ref: '#/components/schemas/InclusionExclusionException'
                  - $ref: '#/components/schemas/UnavailabilityException'
                  - $ref: '#/components/schemas/MinimumShiftIntervalException'
      example: |
        {
          "result": {
            "travelTimes": {
              "0014d909-2ae5-422f-8e37-7a198dc3bacd": 980,
              "00142260-88bd-47ff-9a1a-02968c27b689": 963,
              "001491c7-e61f-4cba-9ccd-5d83e21f0af5": 979,
              "00147360-cb2b-4e84-9156-5f5e5938793b": 823,
              "000822b6-0ba4-4058-8d06-ee795be27cd1": 828,
              "0014e652-8c06-4657-952d-cd5b1d4c7d0c": 316,
              "0005ade1-2a42-431f-a468-594ec4cb3261": 0
            },
            "exceptions": [
              {
                "type": "insufficient-travel-time",
                "on": "00142260-88bd-47ff-9a1a-02968c27b689"
              },
              {
                "type": "node-overlap",
