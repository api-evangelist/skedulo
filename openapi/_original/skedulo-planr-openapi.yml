    ResourceSuggestionResponse:
      type: object
      example: |
        {
          "result": {
            "0005ea18-61c1-49d9-9b50-d16a31a21c20": {
              "resourceId": "0005ea18-61c1-49d9-9b50-d16a31a21c20",
              "jobId": "0014cac9-4ba2-4944-b7ca-b4d2c40b1403",
              "start": "2018-09-03T23:21:00.000Z",
              "duration": 30,
              "travelTime": 17,
              "currentCapacityInSeconds": 86400,
              "newCapacityInSeconds": 83580
            }
          }
        }
      properties:
        result:
          type: object
          additionalProperties:
            type: object
            properties:
              resourceId:
                type: string
                description: UID of the resource.
              jobId:
                type: string
                description: UID of the current job.
              start:
                type: string
                format: date-time
                description: >-
                  Suggested start time of the job as an ISO8601 Date Time
                  string.
              duration:
                type: integer
                description: Duration (in minutes) of the current job.
              travelTime:
                type: integer
                description: >-
                  Travel time (in minutes) from the previous location (resource
                  home or previous job) to the current job.
              currentCapacityInSeconds:
                type: integer
                description: >-
                  Available capacity for the resource based on currently
                  scheduled jobs.
              newCapacityInSeconds:
                type: integer
                description: >-
                  Updated capacity for the resource once this job has been
                  scheduled to the resource.
              infeasibleDueToAvailabilityPreferences:
                type: boolean
                description: >
                  True when this resource is infeasible because its availability
                  preferences do not match the job. Only set when
                  `useAvailabilityPreferences` is true.
              availabilityPreferenceExplanation:
                type: object
                nullable: true
                description: >
                  Explanation of how availability preferences were applied to
                  this resource. Present only when `useAvailabilityPreferences`
                  is true and preferences were evaluated for this resource.
                properties:
                  preferenceFiltered:
                    type: boolean
                    description: >
                      Indicates whether the resource was filtered by
                      availability preferences.
                  matchingRecordFilterIds:
                    type: array
                    items:
                      type: string
                    description: >-
                      IDs of record filters that matched this job for this
                      resource.
                  mismatchedRecordFilterIds:
                    type: array
                    items:
                      type: string
                    description: >-
                      IDs of record filters that did not match for this
                      job/resource.
                  recordFiltersById:
                    type: object
                    description: >
                      Map of record filter IDs used in `matchingRecordFilterIds`
                      and `mismatchedRecordFilterIds` to their definitions.
                    additionalProperties:
                      $ref: '#/components/schemas/RecordFilter'
    SchedulingGridBodyResourceIds:
      type: object
      example: |
        {
          "resourceIds": [
            "0005ade1-2a42-431f-a468-594ec4cb3261",
            "0005ea18-61c1-49d9-9b50-d16a31a21c20"
          ],
          "job": {
            "location": {
              "lat": -27.457865,
              "lng": 153.037271
            }
          },
          "gridSize": 1800,
          "scheduleStart": "2018-11-22T22:00:00.000Z",
          "scheduleEnd": "2018-11-23T01:00:00.000Z",
          "maxTravelTimeInSeconds": 600,
          "includeTravelTimeToAndFromHome": true,
          "regionId": "0005ea18-61c1-49d9-9b50-d16a31a21c20",
          "availabilityFilterValues": [
            {
              "objectType": "Jobs",
              "values": {
                "Type": "Maintenance",
                "Urgency": "Critical"
              }
            }
          ]
        }
      properties:
        resourceIds:
          type: array
          description: An array of resource IDs to generate availability slots.
          items:
            type: string
        job:
          type: object
          description: >-
            Job properties that needs to be considered when generating slots for
            the grid.
          properties:
            location:
              type: object
              description: >-
                Geocoordinates of the job. When this is set, travel time is
                considered when generating slots.
              properties:
                lat:
                  type: number
                  description: Latitude
                lng:
                  type: number
                  description: Longitude
              required:
                - lat
                - lng
        availabilityFilterValues:
          type: array
          description: >
            An array of object types and their associated field values to filter
            availability intervals on. Mutually exclusive with
            `availabilityFilterEntityIds`.
          items:
            type: object
            required:
              - objectType
              - values
            properties:
              objectType:
                type: string
                description: >-
                  The type of object that the fields values are going to be
                  filtered on.
                example: Jobs
              values:
                type: object
                description: >
                  A dictionary of type-specific attributes that define
                  requirements to be evaluated against preferences for

                  resource availability. These attributes (such as job type,
                  urgency, custom fields, etc.) are used to

                  determine which resources are suitable for the job based on
                  their availability preferences. If no

                  attributes are provided, then availability preferences will
                  not be considered.
                example: '{"Type": "Maintenance", "Urgency": "Critical"}'
        availabilityFilterEntityIds:
          type: object
          description: >
            A map of entity types to arrays of entity IDs. The server derives
            filter criteria from the referenced entities. Mutually exclusive
            with `availabilityFilterValues`. Total number of entity IDs across
            all types cannot exceed 50.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            Jobs:
              - 0014cac9-4ba2-4944-b7ca-b4d2c40b1403
        gridSize:
          type: integer
          minimum: 300
          description: The size of the grid slots (in seconds).
        gridInterval:
          type: integer
          minimum: 1
          description: >
            The recurring interval (in seconds) in which to create grid slots. 
            If not set, then by default it is set to be same as grid size which
            will generate

            non-overlapping slots.
        includeTravelTimeToAndFromHome:
          type: boolean
          default: false
          description: >-
            Consider travel time from and to the resources home when checking
            whether the resource is feasible for an availability slot.
        ignoreResourceOverrideLocations:
          type: boolean
          default: false
          description: >
            When using resource overrides (temporary region assignments), do not
            override the resources location with the location

            specified on the override.
        maxTravelTimeInSeconds:
          type: integer
          minimum: 1
          description: >
            The maximum travel time allowed in seconds for a resource to travel
            from a location to the Jobs location

            if specified.  This can be either travel time to and from home or to
            adn from other jobs.  By default this

            functionality is disabled.
        scheduleStart:
          $ref: '#/components/schemas/TimeStamp'
        scheduleEnd:
          $ref: '#/components/schemas/TimeStamp'
        regionId:
          type: string
          description: >
            Resource availability will be based on when resources are available
            in the region specified.  Availability depends

            on the primary region of the resource or whether the resource has
            Temporary or Secondary regions assigned.
      required:
        - job
        - resourceIds
        - scheduleStart
        - scheduleEnd
        - gridSize
    SchedulingGridBodyResources:
      type: object
      example: |
        {
          "resources": {
            "0005ade1-2a42-431f-a468-594ec4cb3261": [
              {
                "start": "2018-11-22T22:00:00.000Z",
                "end": "2018-11-23T01:00:00.000Z"
              }
            ]
          },
          "job": {
            "location": {
              "lat": -27.457865,
              "lng": 153.037271
            }
          },
          "gridSize": 1800,
          "scheduleStart": "2018-11-22T22:00:00.000Z",
          "scheduleEnd": "2018-11-23T01:00:00.000Z",
          "maxTravelTimeInSeconds": 600,
          "includeTravelTimeToAndFromHome": true,
          "regionId": "0005ea18-61c1-49d9-9b50-d16a31a21c20",
          "availabilityFilterValues": [
            {
              "objectType": "Jobs",
              "values": {
                "Type": "Maintenance",
                "Urgency": "Critical"
              }
            }
          ]
        }
      properties:
        resources:
          description: A map of availability windows for each resource.
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                start:
                  $ref: '#/components/schemas/TimeStamp'
                end:
                  $ref: '#/components/schemas/TimeStamp'
        job:
          type: object
          description: >-
            Job properties that needs to be considered when generating slots for
            the grid.
          properties:
            location:
              type: object
              description: >-
                Geocoordinates of the job. When this is set, travel time is
                considered when generating slots.
              properties:
                lat:
                  type: number
                  description: Latitude
                lng:
                  type: number
                  description: Longitude
              required:
                - lat
                - lng
        availabilityFilterValues:
          type: array
          description: >
            An array of object types and their associated field values to filter
            availability intervals on. Mutually exclusive with
            `availabilityFilterEntityIds`.
          items:
            type: object
            required:
              - objectType
              - values
            properties:
              objectType:
                type: string
                description: >-
                  The type of object that the fields values are going to be
                  filtered on.
                example: Jobs
              values:
                type: object
                description: >
                  A dictionary of type-specific attributes that define
                  requirements to be evaluated against preferences for

                  resource availability. These attributes (such as job type,
                  urgency, custom fields, etc.) are used to

                  determine which resources are suitable for the job based on
                  their availability preferences. If no

                  attributes are provided, then availability preferences will
                  not be considered.
                example: '{"Type": "Maintenance", "Urgency": "Critical"}'
        availabilityFilterEntityIds:
          type: object
          description: >
            A map of entity types to arrays of entity IDs. The server derives
            filter criteria from the referenced entities. Mutually exclusive
            with `availabilityFilterValues`. Total number of entity IDs across
            all types cannot exceed 50.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            Jobs:
              - 0014cac9-4ba2-4944-b7ca-b4d2c40b1403
        gridSize:
          type: integer
          minimum: 300
          description: >-
            The size of the grid slots (in seconds). The default is 5 minutes
            (300 seconds).
        gridInterval:
          type: integer
          minimum: 1
          description: >
            The recurring interval (in seconds) in which to create grid slots. 
            If not set, then by default it is set to be same as grid size which
            will generate

            non-overlapping slots.
        includeTravelTimeToAndFromHome:
          type: boolean
          default: false
          description: >-
            Consider travel time from and to the resources home when checking
            whether the resource is feasible for an availability slot.
        ignoreResourceOverrideLocations:
          type: boolean
          default: false
          description: >
            When using resource overrides (temporary region assignments), do not
            override the resources location with the location

            specified on the override.
        maxTravelTimeInSeconds:
          type: integer
          minimum: 1
          description: >
            The maximum travel time allowed in seconds for a resource to travel
            from a location to the Jobs location

            if specified.  This can be either travel time to and from home or to
            adn from other jobs.  By default this

            functionality is disabled.
        scheduleStart:
          $ref: '#/components/schemas/TimeStamp'
        scheduleEnd:
          $ref: '#/components/schemas/TimeStamp'
        regionId:
          type: string
          description: >
            Resource availability will be based on when resources are available
            in the region specified.  Availability depends

            on the primary region of the resource or whether the resource has
            Temporary or Secondary regions assigned.
      required:
        - job
        - resources
        - scheduleStart
        - scheduleEnd
        - gridSize
    SchedulingGridResponse:
      type: object
      example: |
        {
          "result": [
            {
              "start": "2018-11-22T22:00:00.000Z",
              "end": "2018-11-22T22:30:00.000Z",
              "availableResources": [
                "0005ea18-61c1-49d9-9b50-d16a31a21c20"
              ]
            },
            {
              "start": "2018-11-22T22:30:00.000Z",
              "end": "2018-11-22T23:00:00.000Z",
              "availableResources": [
                "0005ea18-61c1-49d9-9b50-d16a31a21c20"
              ]
            },
            {
              "start": "2018-11-22T23:00:00.000Z",
              "end": "2018-11-22T23:30:00.000Z",
              "availableResources": [
                "0005ea18-61c1-49d9-9b50-d16a31a21c20",
                "0005ade1-2a42-431f-a468-594ec4cb3261"
              ]
            },
            {
              "start": "2018-11-22T23:30:00.000Z",
              "end": "2018-11-23T00:00:00.000Z",
              "availableResources": [
                "0005ade1-2a42-431f-a468-594ec4cb3261"
              ]
            },
            {
              "start": "2018-11-23T00:00:00.000Z",
              "end": "2018-11-23T00:30:00.000Z",
              "availableResources": [
                "0005ea18-61c1-49d9-9b50-d16a31a21c20",
                "0005ade1-2a42-431f-a468-594ec4cb3261"
              ]
            },
            {
              "start": "2018-11-23T00:30:00.000Z",
              "end": "2018-11-23T01:00:00.000Z",
              "availableResources": [
                "0005ade1-2a42-431f-a468-594ec4cb3261"
              ]
            }
          ]
        }
      properties:
        result:
          type: array
          items:
            type: object
            properties:
              start:
                $ref: '#/components/schemas/TimeStamp'
              end:
                $ref: '#/components/schemas/TimeStamp'
              availableResources:
                type: array
                description: Resource ids of available resources.
                items:
                  type: string
                  description: List of the resources that are available.
              explainRef:
                type: object
                description: >-
                  Present only when request.explain.enabled=true. Maps
                  resourceId -> explanationId. If no resource has an explanation
                  in the slot, this object will be empty. Resources without
                  contributors or matched groups for a slot will not appear in
                  this map (it may omit some available resources).
                additionalProperties:
                  type: string
            required:
              - start
              - end
              - availableResources
        metadata:
          type: object
          additionalProperties: false
          properties:
            preferences:
              type: object
              additionalProperties: false
              description: >-
                Present only when any matchedRecordFilterIds appear in
                explanations. Contains only used IDs.
              properties:
                recordFiltersById:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/RecordFilter'
            explanationsById:
              type: object
              description: >-
                Registry of unique explanations when explain is enabled. IDs are
                response-local and not stable across requests; do not store or
                assume global uniqueness. Deduplicated within a single response
                (per resource).
              additionalProperties:
                $ref: '#/components/schemas/GridWindowExplanation'
    TravelTimeBody:
      type: object
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/TravelTimeResource'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TravelTimeNode'
        schedulingOptions:
          $ref: '#/components/schemas/SchedulingOptions'
      required:
        - resources
        - nodes
    TravelTimeResponse:
      type: object
      properties:
        result:
          type: object
          description: >-
            The response will contain successful travel times grouped by the
            Nodes id
      example: |
        {
          "result": {
            "0008dea1-7b0b-496c-8043-fb86ff6a73aa": 204,
            "0008cb3c-e5d8-45e6-ba80-cc674aedbbbe": 0,
            "001413ed-c6a5-495d-9fb9-a92503a250c1": 340,
            "001442ff-27e7-40f3-80c8-016305b92230": 344,
            "001484ec-5a47-48ae-bce8-0bf443fbf50c": 163,
            "000555ac-24f1-43fe-b6c0-117c34bbc994": 257
          }
        }
    TravelTimeNode:
      type: object
      properties:
        id:
          type: string
          description: The requesting system's identifier that needs travel time
        resourceId:
          type: string
          description: The identifier of the resource to determine routes and waypoints
        start:
          $ref: '#/components/schemas/TimeStamp'
        end:
          $ref: '#/components/schemas/TimeStamp'
        lat:
          type: number
          description: Latitude
        lng:
          type: number
          description: Longitude
      required:
        - id
        - resourceId
        - start
        - end
    TravelTimeResource:
      type: object
      properties:
        id:
          type: string
          description: The identifier of the resource
        origin:
          $ref: '#/components/schemas/Coordinates'
        availabilities:
          type: array
          description: The time windows when a resource is available
          items:
            type: object
            properties:
              start:
                $ref: '#/components/schemas/TimeStamp'
              end:
                $ref: '#/components/schemas/TimeStamp'
            required:
              - start
              - end
    Coordinates:
      type: object
      description: Geocoordinates of the activity/job/resource
      properties:
        lat:
          type: number
          description: Latitude
        lng:
          type: number
          description: Longitude
      required:
        - lat
        - lng
    TimeStamp:
      type: string
      format: date-time
      description: >-
        Can be either ISO8601 date time string or Unix timestamp number ( in
        milliseconds ). Always returned in ISO8601 format.
    AccountResourceScores:
      type: object
      properties:
        resourceId:
          type: string
          description: >-
            The resource id black listing or white listing jobs associated with
            the account id
        accountId:
          type: string
          description: >-
            The account id associated with jobs black listing or white listing a
            resource
        whitelist:
          type: boolean
          description: >-
            Is true if the resource and jobs assoicated with the account id are
            white listed
        blacklist:
          type: boolean
          description: >-
            Is true if the resource and jobs associated with the account id are
            black listed
      required:
        - resourceId
        - accountId
        - whitelist
        - blacklist
    ResponseConfig:
      type: object
      properties:
        optimizedJobsOnly:
          type: boolean
          default: false
          description: >-
            The scheduled jobs returned are only the jobs optimized. Jobs that
            are fixed (resource and time) are not returned
    SchedulingOptions:
      type: object
      properties:
        jobTimeAsTimeConstraint:
          type: boolean
          default: true
          description: >-
            When a job has a time set, consider it to be a time constraint and
            never re-schedule to another time slot.
        preferJobTimeOverTimeConstraint:
          type: boolean
          default: true
          description: >-
            When a job with a JobTimeConstraint also has a time set, consider
            the job time as the authoritative constraint and ignore the
            JobTimeConstraint.
        respectSchedule:
          type: boolean
          default: true
          description: >-
            For a job that is allocated and in "Pending Dispatch" status, do not
            move the job to a different time.
        ignoreTravelTimes:
          type: boolean
          default: false
          description: Ignore all travel times between resources and jobs.
        ignoreTravelTimeFirstJob:
          type: boolean
          default: false
          description: Ignore travel time from a resource' home location to the first job.
        ignoreTravelTimeLastJob:
          type: boolean
          default: false
          description: Ignore travel time to the resource' home location from the last job.
        assumeResourceCanTravelBeforeStart:
          type: boolean
          default: false
          description: >-
            Ignore travel time to first job when deriving its arrival time
            however include the travel time when considering overall travel time
            reduction.
        assumeResourceCanTravelAfterEnd:
          type: boolean
          default: false
          description: >-
            Assume that the resource can travel after their end time to get to
            their end location however include the travel time when considering
            overall travel time reduction.
        padding:
          type: integer
          default: 0
          description: A fixed interval of time between consecutive jobs.
        snapUnit:
          type: integer
          default: 0
          minimum: 0
          description: >-
            Divide the given time frame into parts described by this value and
            allocate all jobs to the nearest part.
    SchedulingGridExplain:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: false
      description: >-
        When enabled, the response contains per-slot references and a registry
        of explanations for available windows only.
    GridWindowExplanation:
      type: object
      additionalProperties: false
      properties:
        matchedGroups:
          type: array
          description: Matched groups from overlapping contributors, deduplicated.
          items:
            $ref: '#/components/schemas/MatchedGroup'
        contributors:
          type: array
          description: Contributors are returned in the upstream order.
          items:
            $ref: '#/components/schemas/ReasonContributor'
    MatchedGroup:
      type: object
      additionalProperties: false
      properties:
        objectType:
          type: string
        groupId:
          type: string
        matched:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              attr:
                type: string
              expected:
                type: array
                items:
                  type: string
        matchedRecordFilterIds:
          type: array
          items:
            type: string
      required:
        - objectType
        - groupId
    ReasonContributor:
      type: object
      additionalProperties: false
      properties:
        entity:
          type: string
          enum:
            - AvailabilityPatterns
            - Holidays
            - Availabilities
        id:
          type: string
