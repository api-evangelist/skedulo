openapi: 3.0.0
info:
  title: Custom Objects and Fields
  description: >-
    Skedulo Custom Object and Field API. Note that the terms 'object' and
    'schema' are used interchangeably.
  version: 1.0.0
paths:
  /standard_fields/{schemaName}:
    get:
      security:
        - Authorization: []
      summary: Get all standard field mappings for an object
      description: >-
        Gets all standard fields and their Salesforce mappings for a given
        object. This endpoint is not supported for Skedulo Pulse Platform
        tenants (teams).
      operationId: standardFields
      parameters:
        - name: schemaName
          in: path
          description: The name of the object
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOKStandardFields'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VendorNotSupportedError'
                  - $ref: '#/components/schemas/SchemaNotFoundError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vocabularies:
    get:
      security:
        - Authorization: []
      summary: Get all vocabularies (picklist items)
      description: >-
        Returns all vocabularies (standard and custom) keyed on object name with
        values keyed on field name. If no object names are provided,
        vocabularies for all objects are returned.
      operationId: fetchVocabularies
      parameters:
        - name: names
          in: query
          description: >-
            Names of objects to fetch vocabularies for in comma separated
            format. If not provided all vocabularies are returned.
          required: false
          schema:
            type: string
        - name: force
          in: query
          description: >-
            If set to true the cache is replaced with a new value. Has no effect
            if 'names' are provided as individual objects are not cached.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          $ref: '#/components/schemas/PicklistValue'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vocabulary/{objectName}/{fieldName}:
    get:
      security:
        - Authorization: []
      summary: Get vocabulary items for a picklist field
      description: Get the vocabulary items (allowed values) for a picklist field
      operationId: vocabularyFetch
      parameters:
        - name: objectName
          in: path
          description: Name of the object that the picklist field belongs to
          required: true
          schema:
            type: string
        - name: fieldName
          in: path
          description: Name of the picklist field
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/VocabularyItem'
        '400':
          description: >-
            If the field does not exist or is not a picklist or multipicklist
            field
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      security:
        - Authorization: []
      summary: Add a vocabulary (picklist) item
      description: Add an allowed item to a picklist field
      operationId: vocabularyCreate
      parameters:
        - name: objectName
          in: path
          description: Name of the object that the picklist field belongs to
          required: true
          schema:
            type: string
        - name: fieldName
          in: path
          description: Name of the picklist field
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The item was added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOKVocabulary'
        '400':
          description: >-
            If the field does not exist or is not a picklist or multipicklist
            field
        '403':
          description: If the user does not have the required permissions
        '409':
          description: An item with that value already exists
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyItem'
        description: The item to add
        required: true
  /vocabulary/{objectName}/{fieldName}/{value}:
    put:
      security:
        - Authorization: []
      summary: Update a vocabulary item on a picklist field
      description: Update a picklist item. Note the value cannot be modified
      operationId: vocabularyUpdate
      parameters:
        - name: objectName
          in: path
          description: Name of the object that the picklist field belongs to
          required: true
          schema:
            type: string
        - name: fieldName
          in: path
          description: Name of the picklist field
          required: true
          schema:
            type: string
        - name: value
          in: path
          description: Value of the vocabulary item to modify
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The item was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOKEmpty'
        '400':
          description: >-
            If the field does not exist or is not a picklist or multipicklist
            field
        '403':
          description: If the user does not have the required permissions
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifiedVocabularyItem'
        description: The item to modify
        required: true
    delete:
      security:
        - Authorization: []
      summary: Deactivate a vocabulary item for a picklist
      description: Sets the active state of the vocabulary item to false
      operationId: vocabularyDeactivate
      parameters:
        - name: objectName
          in: path
          description: Name of the object that the picklist field belongs to
          required: true
          schema:
            type: string
        - name: fieldName
          in: path
          description: Name of the picklist field
          required: true
          schema:
            type: string
        - name: value
          in: path
          description: Vocabulary item value to deactivate
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The item was deactivated
        '400':
          description: >-
            If the field does not exist or is not a picklist or multipicklist
            field
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vocabulary/dependency:
    post:
      security:
        - Authorization: []
      summary: Create or modify a dependency relationship on a picklist field
      description: >-
        Set up a dependency between picklist items (vocabulary) and another
        field
      operationId: upsertFieldDependency
      responses:
        '200':
          description: The dependency relationship was created or updated
        '400':
          description: If fields or entries provided were invalid
        '403':
          description: If the user does not have the required permissions
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldDependencyInput'
        description: The dependency relationship to be created or updated
        required: true
  /vocabulary/dependency/delete:
    post:
      security:
        - Authorization: []
      summary: Remove the dependency relationship of a picklist field
      description: ''
      operationId: deleteFieldDependency
      responses:
        '200':
          description: The dependency relationship was removed
        '400':
          description: If fields provided were invalid
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldDependencyKeyInput'
        description: The dependency relationship to be removed
        required: true
  /vocabulary/dependency/entry:
    post:
      security:
        - Authorization: []
      summary: Add a dependency to a picklist value
      description: Add a dependency between a picklist value and another value
      operationId: addFieldDependencyEntry
      responses:
        '200':
          description: The dependency relationship was created or updated
        '400':
          description: If fields or entry provided were invalid
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldDependencyEntryInput'
        description: The dependency relationship to be created or updated
        required: true
  /vocabulary/dependency/entry/delete:
    post:
      security:
        - Authorization: []
      summary: Remove the dependency on a picklist value
      description: ''
      operationId: deleteFieldDependencyEntry
      responses:
        '200':
          description: The dependency relationship was removed
        '400':
          description: If fields or entry provided were invalid
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldDependencyKeyInput'
        description: The dependency relationship to be removed
        required: true
  /standalone/schemas:
    post:
      security:
        - Authorization: []
      summary: Create a custom object for a Skedulo Pulse Platform tenant (team)
      description: ''
      operationId: standaloneCreateObject
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: object
                    required:
                      - schema
                      - fields
                    properties:
                      schema:
                        $ref: '#/components/schemas/CustomSchema'
                      fields:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomField'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStandaloneCustomSchema'
        description: Standalone custom object
        required: true
  /standalone/schema/{objectId}:
    delete:
      security:
        - Authorization: []
      summary: Remove a custom object
      description: This will remove the object along with all data contained within it
      operationId: standaloneDeleteObject
      parameters:
        - name: objectId
          in: path
          description: Identifier of the object to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /standalone/schema/{objectId}/track:
    post:
      security:
        - Authorization: []
      summary: Track a custom object
      description: >-
        Enable the tracking of row inserts, updates, and deletes. Changes are
        available via GraphQL subscriptions and webhooks.
      operationId: standaloneTrackObject
      parameters:
        - name: objectId
          in: path
          description: Identifier of the object to track
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      security:
        - Authorization: []
      summary: Disable tracking of a custom object
      description: >-
        Disable the tracking of row inserts, updates, and deletes for a custom
        object.
      operationId: standaloneUntrackObject
      parameters:
        - name: objectId
          in: path
          description: Identifier of the object to untrack
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /standalone/fields:
    post:
      security:
        - Authorization: []
      summary: Create a standalone custom field
      description: ''
      operationId: standaloneCreateField
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/CustomField'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStandaloneCustomField'
        description: Standalone custom field
        required: true
  /standalone/field/{fieldId}:
    delete:
      security:
        - Authorization: []
      summary: Remove a custom field
      description: This will remove the field along with any data it contains
      operationId: standaloneDeleteField
      parameters:
        - name: fieldId
          in: path
          description: Identifier of the field to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
servers:
  - url: https://api.skedulo.com/custom
  - url: https://api.uk.skedulo.com/custom
  - url: https://api.ca.skedulo.com/custom
  - url: https://api.au.skedulo.com/custom
components:
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CustomField:
      type: object
      required:
        - id
        - name
        - schemaName
        - fieldType
        - mapping
        - required
        - upsertKey
        - accessMode
        - readOnly
        - isAlert
        - showDesktop
        - showMobile
        - editableOnMobile
        - requiredOnMobile
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Internal name
        schemaName:
          type: string
          description: The name of the object this field belongs to
        label:
          type: string
          description: Display name
        description:
          type: string
          description: Description display only when modifying this field's definition
        fieldType:
          type: string
          enum:
            - string
            - id
            - calculated
            - email
            - encryptedstring
            - reference
            - textarea
            - htmltextarea
            - combobox
            - multipicklist
            - picklist
            - phone
            - url
            - int
            - double
            - decimal
            - currency
            - percent
            - duration
            - time
            - date
            - datetime
            - boolean
        mapping:
          type: string
          description: >-
            The name of the field in the remote system (eg. sked__FieldName__c
            for Salesforce)
        referenceSchemaName:
          type: string
          description: The name of the object. Required if fieldType is reference
        referenceSchemaFieldName:
          type: string
          description: The name of the field in the referenced object
        required:
          type: boolean
        upsertKey:
          type: boolean
        accessMode:
          type: string
          enum:
            - read_only
            - read_write
            - insert_only
        readOnly:
          description: Deprecated in favor of 'accessMode'
          type: boolean
        maxLength:
          description: The maximum number of characters that are allowed
          type: integer
        precision:
          description: >-
            The total number of digits that are allowed. For example, the number
            123.45 has a precision of 5.
          type: integer
        scale:
          description: >-
            The number of digits to the right of the decimal point that are
            allowed. For example, the number 123.45 has a scale of 2.
          type: integer
        isAlert:
          description: >-
            Should this field be promoted and shown at the top? Only one field
            per object can have this set.
          type: boolean
        showIf:
          type: string
        showDesktop:
          type: boolean
        showMobile:
          type: boolean
        editableOnMobile:
          type: boolean
        requiredOnMobile:
          type: boolean
        displayOrder:
          type: integer
    CustomFieldInput:
      type: object
      required:
        - name
        - schemaName
        - fieldType
        - mapping
      properties:
        id:
          description: >-
            If not provided a new field is created otherwise the field with the
            ID is updated
          type: string
          format: uuid
        name:
          type: string
          description: Internal name
        schemaName:
          type: string
          description: The name of the object this field belongs to
        label:
          type: string
          description: Display name
        description:
          type: string
          description: Description display only when modifying this fields definition
        fieldType:
          type: string
          enum:
            - string
            - id
            - calculated
            - email
            - encryptedstring
            - reference
            - textarea
            - htmltextarea
            - combobox
            - multipicklist
            - picklist
            - phone
            - url
            - int
            - double
            - decimal
            - currency
            - percent
            - duration
            - time
            - date
            - datetime
            - boolean
        mapping:
          type: string
          description: >-
            The name of the field in the remote system (eg. sked__FieldName__c
            for Salesforce)
        referenceSchemaName:
          type: string
          description: The name of the object. Required if fieldType is reference.
        referenceSchemaFieldName:
          type: string
          description: The name of the field in the referenced object
        required:
          type: boolean
          default: false
        upsertKey:
          type: boolean
          default: false
        accessMode:
          type: string
          enum:
            - read_only
            - read_write
            - insert_only
          default: read_write
        readOnly:
          description: Deprecated in favor of 'accessMode' and ignored if it is set
          type: boolean
          default: false
        maxLength:
          description: The maximum number of characters that are allowed
          type: integer
        precision:
          description: >-
            The total number of digits that are allowed. For example, the number
            123.45 has a precision of 5.
          type: integer
        scale:
          description: >-
            The number of digits to the right of the decimal point that are
            allowed. For example, the number 123.45 has a scale of 2.
          type: integer
        showIf:
          type: string
        isAlert:
          description: >-
            Should this field be promoted and shown at the top? Only one field
            per object can have this set.
          type: boolean
          default: false
        showDesktop:
          type: boolean
          default: true
        showMobile:
          type: boolean
          default: false
        editableOnMobile:
          type: boolean
          default: false
        requiredOnMobile:
          type: boolean
          default: false
        displayOrder:
          type: integer
    CustomSchema:
      type: object
      required:
        - id
        - name
        - mapping
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Internal name
        label:
          type: string
          description: Display name
        description:
          type: string
          description: Description display only when modifying this field's definition
        mapping:
          type: string
          description: >-
            The name of the object in the remote system (e.g. 'order' for
            Skedulo platform or 'Order__c' for Salesforce)
    CustomSchemaInput:
      type: object
      required:
        - name
        - mapping
      properties:
        id:
          description: >-
            If not provided a new object is created otherwise the object with
            the id is updated
          type: string
          format: uuid
        name:
          type: string
          description: Internal name
        label:
          type: string
          description: Display name
        description:
          type: string
          description: Description display only when modifying this field's definition
        mapping:
          type: string
          description: >-
            The name of the object in the remote system (e.g. 'order' for
            Skedulo platform or 'Order__c' for Salesforce)
    NewStandaloneCustomSchema:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Internal name
        label:
          type: string
          description: Display name
        description:
          type: string
          description: Description display only when modifying this field's definition
        fields:
          type: array
          items:
            $ref: '#/components/schemas/NewStandaloneCustomSchemaField'
          description: >-
            Fields to create at the same time as the object. These fields are
            allowed to be required and have no default as there is no data in
            the object yet.
    NewStandaloneCustomSchemaField:
      type: object
      required:
        - name
        - column
      properties:
        name:
          type: string
          description: Internal name
        label:
          type: string
          description: Display name
        description:
          type: string
          description: Description display only when modifying this fields definition
        accessMode:
          type: string
          enum:
            - read_only
            - read_write
            - insert_only
          default: read_write
        column:
          $ref: '#/components/schemas/NewStandaloneCustomFieldColumn'
        showIf:
          type: string
        isAlert:
          description: >-
            Should this field be promoted and shown at the top? Only one field
            per object can have this set.
          type: boolean
          default: false
        showDesktop:
          type: boolean
          default: true
        showMobile:
          type: boolean
          default: false
        editableOnMobile:
          type: boolean
          default: false
        requiredOnMobile:
          type: boolean
          default: false
        displayOrder:
          type: integer
    NewStandaloneCustomField:
      type: object
      required:
        - name
        - schemaName
        - column
      properties:
        name:
          type: string
          description: Internal name
        schemaName:
          type: string
          description: The name of the object this field belongs to
        label:
          type: string
          description: Display name
        description:
          type: string
          description: Description display only when modifying this field's definition
        accessMode:
          type: string
          enum:
            - read_only
            - read_write
            - insert_only
          default: read_write
        column:
          $ref: '#/components/schemas/NewStandaloneCustomFieldColumn'
        showIf:
          type: string
        isAlert:
          description: >-
            Should this field be promoted and shown at the top? Only one field
            per object can have this set.
          type: boolean
          default: false
        showDesktop:
          type: boolean
          default: true
        showMobile:
          type: boolean
          default: false
        editableOnMobile:
          type: boolean
          default: false
        requiredOnMobile:
          type: boolean
          default: false
        displayOrder:
          type: integer
    NewStandaloneCustomFieldColumn:
      type: object
      required:
        - type
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          enum:
            - string
            - textarea
            - url
            - picklist
            - multipicklist
            - int
            - decimal
            - boolean
            - date
            - datetime
            - time
            - reference
    NewStandaloneCustomFieldColumnString:
      allOf:
        - $ref: '#/components/schemas/NewStandaloneCustomFieldColumn'
      properties:
        required:
          type: boolean
          default: false
        unique:
          type: boolean
          default: false
        defaultValue:
          type: string
          description: Must be set if adding a required field
        temporaryDefaultValue:
          type: boolean
          description: Is the default value only used when creating the field
          default: false
        maxLength:
          type: integer
          description: The maximum number of characters that are allowed
          default: 255
    NewStandaloneCustomFieldColumnTextArea:
      allOf:
        - $ref: '#/components/schemas/NewStandaloneCustomFieldColumn'
      properties:
        required:
          type: boolean
          default: false
        defaultValue:
          type: string
          description: Must be set if adding a required field
        temporaryDefaultValue:
          type: boolean
          description: Is the default value only used when creating the field
          default: false
        maxLength:
          type: integer
          description: The maximum number of characters that are allowed
          default: 255
    NewStandaloneCustomFieldColumnUrl:
      allOf:
        - $ref: '#/components/schemas/NewStandaloneCustomFieldColumn'
      properties:
        required:
          type: boolean
          default: false
        unique:
          type: boolean
          default: false
        defaultValue:
          type: string
          description: >-
            Must be set if adding a required field. A URL field can be templated
            using 'mustache' format where the template parameter refers to a
            field of the parent object. e.g. for a Job, {{Name}} will be
            translated to the value of Job.Name
        temporaryDefaultValue:
          type: boolean
          description: Is the default value only used when creating the field
          default: false
        maxLength:
          type: integer
          description: The maximum number of characters that are allowed
          default: 255
    NewStandaloneCustomFieldColumnPicklist:
      allOf:
        - $ref: '#/components/schemas/NewStandaloneCustomFieldColumn'
      required:
        - items
      properties:
        required:
          type: boolean
          default: false
        defaultValue:
          type: string
          description: Must be set if adding a required field
        temporaryDefaultValue:
          type: boolean
          description: Is the default value only used when creating the field
          default: false
        items:
          type: array
          items:
            type: array
            items:
              type: string
          description: >-
