          items:
            $ref: '#/components/schemas/FieldMetadata'
        relationships:
          type: array
          description: Relationships that reference this object
          items:
            $ref: '#/components/schemas/ObjectMetadataRelationship'
    FieldMetadata:
      type: object
      required:
        - label
        - mapping
        - type
        - nillable
        - length
        - upsertKey
        - unique
        - readOnly
        - accessMode
        - values
      properties:
        label:
          type: string
          description: Display name
        mapping:
          type: string
          description: >-
            The name of the field in the remote system (eg. Field__c for
            Salesforce)
        name:
          type: string
          nullable: true
          description: >-
            The name of the field in the Skedulo system. Null if the field is
            not defined in Skedulo.
        type:
          type: string
          enum:
            - string
            - id
            - calculated
            - email
            - encryptedstring
            - reference
            - textarea
            - htmltextarea
            - combobox
            - multipicklist
            - picklist
            - phone
            - url
            - int
            - double
            - decimal
            - currency
            - percent
            - duration
            - time
            - date
            - datetime
            - boolean
        nillable:
          type: boolean
        length:
          description: >-
            The allowed length of the field. Possibly returns 0 in certain cases
            as a fallback value. Deprecated in favour of 'maxLength'.
          type: integer
        maxLength:
          description: >-
            The maximum allowed length of the field. Can return null if a
            maximum length does not apply.
          type: integer
        precision:
          description: >-
            The total number of digits that are allowed. For example, the number
            123.45 has a precision of 5.
          type: integer
        scale:
          description: >-
            The number of digits to the right of the decimal point that are
            allowed. For example, the number 123.45 has a scale of 2.
          type: integer
        upsertKey:
          type: boolean
        unique:
          type: boolean
        readOnly:
          description: >-
            Deprecated in favour of 'accessMode' which contains more information
            about how a field can be accessed
          type: boolean
        accessMode:
          type: string
          enum:
            - read_only
            - read_write
            - insert_only
            - update_only
        relationship:
          $ref: '#/components/schemas/FieldMetadataRelationship'
        values:
          type: array
          items:
            $ref: '#/components/schemas/FieldMetadataValue'
    FieldMetadataRelationship:
