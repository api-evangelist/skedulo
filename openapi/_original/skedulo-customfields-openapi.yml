          type: boolean
          default: false
        defaultValue:
          type: integer
          description: Must be set if adding a required field
        temporaryDefaultValue:
          type: boolean
          description: Is the default value only used when creating the field
          default: false
    NewStandaloneCustomFieldColumnDecimal:
      allOf:
        - $ref: '#/components/schemas/NewStandaloneCustomFieldColumn'
      properties:
        required:
          type: boolean
          default: false
        unique:
          type: boolean
          default: false
        defaultValue:
          type: string
          description: Must be set if adding a required field
        temporaryDefaultValue:
          type: boolean
          description: Is the default value only used when creating the field
          default: false
        precision:
          description: >-
            The total number of digits that are allowed. For example, the number
            123.45 has a precision of 5. The minimum value is 1 and the maximum
