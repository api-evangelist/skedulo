          required: false
          schema:
            maxItems: 3
            minItems: 1
            uniqueItems: true
            type: array
            items:
              type: string
              example: INSERT
              enum:
                - INSERT
                - UPDATE
                - DELETE
        - name: limit
          in: query
          description: Number of results to return
          required: false
          schema:
            maximum: 500
            minimum: 1
            type: string
        - name: sortOrder
          in: query
          description: Order in which to sort results (by event timestamp)
          required: false
          schema:
            pattern: (?i)asc|desc
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordChangeFetchResultSimple'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
