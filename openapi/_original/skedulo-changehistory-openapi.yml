              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
components:
  schemas:
    ErrorDetails:
      type: object
      properties:
        errorType:
          type: string
        message:
          type: string
    RecordChangeFetchResult:
      required:
        - result
      type: object
      properties:
        nextCursor:
          type: string
          description: >-
            An opaque cursor representing the current position in the stream of
            changes.  This can be supplied to the next fetch invocation to
            obtain the next page of results.
        result:
          type: array
          description: The list of changes.
          items:
            $ref: '#/components/schemas/TenantRecordChangeLog'
      description: A series of record changes for a tenant
    RecordChangeFetchResultSimple:
      required:
        - result
      type: object
      properties:
        nextCursor:
          type: string
          description: >-
            An opaque cursor representing the current position in the stream of
            changes.  This can be supplied to the next fetch invocation to
            obtain the next page of results.
        result:
          type: array
          description: The list of changes.
          items:
            $ref: '#/components/schemas/TenantRecordChangeLogSimple'
      description: A series of record changes for a tenant in a simple format
    TenantRecordChangeLog:
      required:
        - data
        - entityId
        - entityType
        - occurredAt
        - operation
        - userId
      type: object
      properties:
        occurredAt:
          type: string
          format: date-time
        userId:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        operation:
          type: string
        data:
          type: object
        previous:
          type: object
        metadata:
          type: object
      description: Describes a single change to a piece of tenant data.
    TenantRecordChangeLogSimple:
      required:
        - entityId
        - entityType
        - occurredAt
        - operation
        - userId
      type: object
      properties:
        occurredAt:
          type: string
          format: date-time
        userId:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        operation:
          type: string
      description: A slim version of TenantRecordChangeLog omitting heavy data fields.
    TenantStatusResponse:
      required:
        - status
        - tenantId
      type: object
      properties:
        tenantId:
          type: string
          description: The tenant identifier
          example: sk_d9778d81d2e94e428984a85278b266fb
        status:
          type: string
          description: The tenant status
          example: active
          enum:
            - active
            - deleting
            - deleted
      description: The current status of a tenant in event-store
    Transaction:
      required:
        - changes
        - transactionId
      type: object
      properties:
        transactionId:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/TenantRecordChangeLog'
      description: A single transaction containing multiple tenant data changes
    TransactionSimple:
      required:
        - changes
        - transactionId
      type: object
      properties:
        transactionId:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/TenantRecordChangeLogSimple'
      description: >-
        A single transaction containing multiple tenant data changes in a simple
        format
    TransactionsFetchResult:
      required:
        - result
      type: object
      properties:
        nextCursor:
          type: string
          description: >-
            An opaque cursor representing the current position in the stream of
            changes.  This can be supplied to the next fetch invocation to
            obtain the next page of results.
        result:
          type: array
          description: The list of changes grouped by transaction.
          items:
            $ref: '#/components/schemas/Transaction'
    TransactionsFetchResultSimple:
      required:
        - result
      type: object
      properties:
        nextCursor:
          type: string
          description: >-
            An opaque cursor representing the current position in the stream of
            changes.  This can be supplied to the next fetch invocation to
            obtain the next page of results.
        result:
          type: array
          description: The list of changes grouped by transaction in a simple format.
          items:
            $ref: '#/components/schemas/TransactionSimple'
      description: A series of transactions for a tenant in a simple format
  securitySchemes:
    ApiKeyAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
