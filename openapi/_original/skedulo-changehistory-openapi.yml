openapi: 3.0.1
info:
  title: Event Store API
  version: '0.1'
servers:
  - url: https://api.skedulo.com/events
  - url: https://api.uk.skedulo.com/events
  - url: https://api.ca.skedulo.com/events
  - url: https://api.au.skedulo.com/events
paths:
  /transactions/simple:
    get:
      tags:
        - api-controller
      summary: Get record change transactions (simple)
      description: >-
        Return data changes for the current tenant and search parameters,
        grouped by transaction, in a simple format.
      operationId: transactionsSimple
      parameters:
        - name: cursor
          in: query
          description: >-
            An opaque cursor representing a position in the stream of
            transactions. Provide this to return all transactions after this
            position. Returned in the nextCursor property of a transactions
            result.
          required: false
          schema:
            type: string
        - name: start
          in: query
          description: Filter transactions after this timestamp (UTC) inclusive
          required: false
          schema:
            type: string
            format: date-time
          example: '2021-12-24T00:00:00Z'
        - name: end
          in: query
          description: Filter transactions before this timestamp (UTC)
          required: false
          schema:
            type: string
            format: date-time
          example: '2021-12-24T00:00:00Z'
        - name: userIds
          in: query
          description: Filter transactions by user ids
          required: false
          schema:
            maxItems: 50
            minItems: 1
            uniqueItems: true
            type: array
            items:
              type: string
              example: aea7174c-b0d2-4aa0-bc4b-e59e7e441eab
        - name: entityTypes
          in: query
          description: Filter transactions by entity types
          required: false
          schema:
            maxItems: 50
            minItems: 1
            uniqueItems: true
            type: array
            items:
              type: string
              example: Job
        - name: entityIds
          in: query
          description: Filter transactions by entity ids
          required: false
          schema:
            maxItems: 50
            minItems: 1
            uniqueItems: true
            type: array
            items:
              type: string
              example: b4eeb467-3db6-44cf-a691-01205341b0dd
        - name: operations
          in: query
          description: Filter transactions by operations
          required: false
          schema:
            maxItems: 3
            minItems: 1
            uniqueItems: true
            type: array
            items:
              type: string
              example: INSERT
              enum:
                - INSERT
                - UPDATE
                - DELETE
        - name: limit
          in: query
          description: Number of results to return
          required: false
          schema:
            maximum: 50
            minimum: 1
            type: string
        - name: sortOrder
          in: query
          description: Order in which to sort results (by event timestamp)
          required: false
          schema:
            pattern: (?i)asc|desc
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsFetchResultSimple'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
