    PVRPFeatureOptionsShape:
      type: object
      properties:
        full:
          type: boolean
          description: >-
            If true, runs a full optimization pass; if false, only optimizes
            unscheduled allocations
        ignoreTravelTime:
          type: boolean
          description: >-
            If true, travel time between locations is not considered when
            scoring the solution
        ignoreTravelTimeFirstJob:
          type: boolean
          description: >-
            If true, travel time to a resource's first allocation of the day is
            not penalised
        ignoreTravelTimeLastJob:
          type: boolean
          description: >-
            If true, travel time from a resource's last allocation of the day is
            not penalised
        minimizeResources:
          type: boolean
          description: >-
            If true, the optimizer will attempt to use the minimum number of
            resources required to service all allocations
        maxDailyTravelTimeInMinutes:
          type: integer
          description: >-
            Global maximum total travel time per resource per day in minutes;
            can be overridden per resource
          format: int64
        maxTravelTimeBetweenLocations:
          type: integer
          description: >-
            Global maximum travel time between any two consecutive allocation
            locations in minutes; can be overridden per resource
          format: int64
        respectAllocationTimes:
          type: boolean
          description: >-
            If true, currently scheduled start times are treated as soft
            constraints that the optimizer will try to preserve
        respectAllocationTimesOverTimeConstraints:
          type: boolean
          description: >-
            If true, existing allocation start times take precedence over
            schedule time window constraints when the two conflict
        balanceAbsoluteWorkload:
          type: boolean
          description: >-
            If true, the optimizer will try to balance the total absolute
            working time evenly across all resources
        snapUnit:
          type: integer
          description: >-
            Snap allocation start times to multiples of this value in minutes;
            useful to avoid solutions with odd start times
          format: int32
        padding:
          type: integer
          description: >-
            Minimum gap in minutes that must be left between consecutive
            allocations for a resource, in addition to travel time
          format: int32
        objectiveWeights:
          $ref: '#/components/schemas/ObjectiveWeightsShape'
        objectiveWeightModifiers:
          $ref: '#/components/schemas/ObjectiveWeightModifiersShape'
        temporalAffinityStrength:
          type: integer
          description: >-
            Strength of the preference to schedule allocations close in time to
            their schedule time windows (1-100)
          format: int32
        enablePartiallyAllocatedGroups:
          type: boolean
          description: >-
            If true, allocation groups that cannot be fully assigned will be
            partially assigned rather than left unscheduled
        enablePartiallyAllocatedAllocationDependencies:
          type: boolean
          description: >-
            If true, allocation dependencies that cannot be fully assigned will
            be partially assigned rather than left unscheduled
