components:
  schemas:
    APIFeatureRunDetailsShape:
      required:
        - id
        - operation
        - optimizationType
        - start
        - status
        - createdByUserId
        - label
        - window
      type: object
      properties:
        id:
          type: string
        operation:
          type: string
          enum:
            - optimize
            - evaluate
            - suggest
        optimizationType:
          type: string
          enum:
            - arc
            - pvrp
        errors:
          $ref: '#/components/schemas/List_StringifiedRunError'
        start:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - queued
            - calculatingRoutes
            - optimizing
            - complete
            - failed
        scheduleId:
          type: string
        createdByUserId:
          type: string
        label:
          type: string
        completedAt:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/RunSummary'
        window:
          $ref: '#/components/schemas/ScheduleRunWindow'
    APIIdInput:
      required:
        - resourceIds
        - jobIds
      type: object
      properties:
        resourceIds:
          type: array
          items:
            type: string
        jobIds:
          type: array
          items:
            type: string
        regionId:
          type: string
        regionIds:
          type: array
          items:
            type: string
      description: The ids of entities requested in the optimization run
    APIProductData:
      required:
        - jobs
        - activities
        - resources
        - accountResourceScores
        - locationResourceScores
        - availability
        - start
        - end
        - timezone
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLJob'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLActivity'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLResource'
        accountResourceScores:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLAccountResourceScore'
        locationResourceScores:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLLocationResourceScore'
        availability:
          $ref: '#/components/schemas/Map_ResourceId_ResourceAvailability'
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        rollingScheduleWindows:
          type: array
          items:
            $ref: '#/components/schemas/RollingScheduleWindow'
        timezone:
          type: string
        region:
          $ref: '#/components/schemas/GraphQLRegion'
        regions:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLRegion'
      description: All the data retrieved from GraphQL to run the optimization
    APIProductRunDetailsShape:
      required:
        - id
        - operation
        - optimizationType
        - autoSaved
        - saveState
        - start
        - status
        - createdByUserId
        - label
        - window
      type: object
      properties:
        id:
          type: string
        operation:
          type: string
          enum:
            - optimize
            - evaluate
            - suggest
        optimizationType:
          type: string
          enum:
            - arc
            - pvrp
        autoSaved:
          type: boolean
        savedByUserId:
          type: string
        savedByDate:
          type: string
          format: date-time
        saveState:
          type: string
          enum:
            - pending
            - saved
            - rejected
            - error
        errors:
          $ref: '#/components/schemas/List_StringifiedRunError'
        start:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - queued
            - calculatingRoutes
            - optimizing
            - complete
            - failed
        scheduleId:
          type: string
        createdByUserId:
          type: string
        label:
          type: string
        completedAt:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/RunSummary'
        window:
          $ref: '#/components/schemas/ScheduleRunWindow'
    APISaveResultsShape:
      oneOf:
        - $ref: '#/components/schemas/Error'
        - $ref: '#/components/schemas/Pending'
        - $ref: '#/components/schemas/Rejected'
        - $ref: '#/components/schemas/Saved'
    ARCShiftDiffShape:
      required:
        - solver
        - allocations
      type: object
      properties:
        solver:
          type: string
          enum:
            - arc
        allocations:
          $ref: '#/components/schemas/Map_DiffAllocationShape'
        meta:
          type: object
          description: Arbitrary JSON object (key/value pairs)
          additionalProperties:
            description: Any JSON value (string, number, boolean, null, object, or array)
    ARCShiftFeatureModelResultsShape:
      required:
        - type
        - scheduled
        - unscheduled
      type: object
      properties:
        type:
          type: string
          description: Identifies the solver type; always 'arc' for ARCShift results
        scheduled:
          $ref: '#/components/schemas/Map_ARCShiftScheduledAllocationShape'
        unscheduled:
          $ref: '#/components/schemas/Map_ARCShiftUnscheduledAllocationShape'
    ARCShiftModelShape:
      required:
        - allocations
        - resources
        - statutes
        - locations
        - sharedAttributes
        - fairnessBuckets
        - schedulingPeriod
        - timezone
        - options
        - solver
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationShape'
          description: Shifts to be optimally allocated to resources
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceShape'
          description: Resources (workers) available for shift assignment
        statutes:
          type: array
          items:
            $ref: '#/components/schemas/ResourceStatuteShape'
          description: >-
            Contractual constraint sets that can be applied to resources,
            defining limits on rest periods and working hours
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationShape1'
          description: >-
            Geographic coordinates for all locations referenced by allocations
            and resources
        sharedAttributes:
          type: array
          items:
            $ref: '#/components/schemas/SharedAttributesShape'
          description: >-
            Cross-allocation skill requirements that enforce a minimum number of
            the listed allocations to be assigned to resources with the
            specified attribute
        fairnessBuckets:
          type: array
          items:
            $ref: '#/components/schemas/FairnessBucketShape'
          description: >-
            Periods used to balance total working time fairly across a group of
            resources
        schedulingPeriod:
          $ref: '#/components/schemas/TimeBounds'
        timezone:
          type: string
          description: >-
            The timezone used for period constraint and fairness bucket
            calculations
        options:
          $ref: '#/components/schemas/ShiftFeatureOptionsShape'
        meta:
          type: object
          description: Additional arbitrary metadata associated with the model
          additionalProperties:
            description: Any JSON value (string, number, boolean, null, object, or array)
        solver:
          type: string
          description: Identifies the solver type; always 'arc' for ARCShift models
          enum:
            - arc
    ARCShiftScheduledAllocationShape:
      required:
        - resourceId
      type: object
      properties:
        resourceId:
          type: string
          description: The resource assigned to this allocation
    ARCShiftUnscheduledAllocationShape:
      type: object
      properties:
        previousResourceId:
          type: string
          description: >-
            The resource that was previously assigned to this allocation before
            the optimization run, if any
    Activity:
      required:
        - type
        - activityId
        - duration
        - lat
        - lng
      type: object
      properties:
        type:
          type: string
          description: '`activity`'
          enum:
            - activity
        activityId:
          type: string
        arrivalTime:
          type: string
          format: date-time
        departureTime:
          type: string
          format: date-time
        duration:
          type: integer
          format: int64
        travelTimeToNext:
          type: integer
          format: int64
        distanceToNext:
          type: integer
          format: int32
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
    AllocationAttributeShape:
      required:
        - id
      type: object
      properties:
        id:
          type: string
          description: The attribute identifier
        weighting:
          type: integer
          description: >-
            If present, this is a soft (preferred) requirement with the given
            weighting; if absent, this is a hard (required) attribute
          format: int32
    AllocationDependencyShape:
      required:
        - anchorAllocationId
        - dependentAllocationId
      type: object
      properties:
        anchorAllocationId:
          type: string
          description: >-
            The allocation that represents the fixed point in time that the
            dependent allocation must be scheduled relative to
        dependentAllocationId:
          type: string
          description: >-
            The allocation that must be scheduled relative to the anchor
            allocation
        minTimeIntervalInMinutes:
          type: integer
          description: >-
            The offset that defines the start of the valid window of time
            relative to the anchor, if blank the dependent allocation has no
            earliest start time constraint, can be negative to represent a time
            before the anchor allocation
          format: int64
        maxTimeIntervalInMinutes:
          type: integer
          description: >-
            The offset that defines the end of the valid window of time for the
            dependent allocation to start relative to the anchor, if blank the
            dependent allocation has no latest start time constraint, can be
            negative to represent a time before the anchor allocation
          format: int64
        enablePartialAllocation:
          type: boolean
          description: >-
            Allows allocations in the allocation dependency to be partially
            allocated if they cannot be fully allocated. This will be overridden
            by the global setting
            options.enablePartiallyAllocatedAllocationDependencies if the global
            setting is true.
    AllocationGroupShape:
      required:
        - id
        - locked
      type: object
      properties:
        id:
          type: string
        synchronizationMode:
          type: string
          description: The time that should be synchronised for each job in the group
          default: no_synchronization
          enum:
            - no_synchronization
            - start_time
            - end_time
            - day
        locked:
          type: boolean
          description: If the group is locked, all allocations in the group will be locked
        enablePartialAllocation:
          type: boolean
          description: >-
            Allows allocations in the group to be partially allocated if they
            cannot be fully allocated. This will be overridden by the global
            setting options.enablePartiallyAllocatedGroups if the global setting
            is true.
          default: false
        phaseTags:
          type: array
          items:
            type: string
          description: >-
            Phase tags that restrict this group to specific phases. If absent or
            empty, the group is included in all phases.
    AllocationLocked:
      required:
        - type
      type: object
      properties:
        type:
          type: string
          description: '`allocation_locked`'
          enum:
            - allocation_locked
      description: >-
        The allocation is locked. The current resource and time cannot be
        reassigned.
    AllocationResourceConstraintShape:
      required:
        - type
        - resources
      type: object
      properties:
        type:
          type: string
          description: >-
            Whether the resources list is a blocked (excluded) or allowed
            (included) list
          enum:
            - blocked
            - allowed
        resources:
          type: array
          items:
            type: string
          description: The resources to which this constraint applies
      description: >-
        Restricts which resources may be assigned to this allocation (blocked or
        allowed list)
    AllocationResourceRatingShape:
      required:
        - resourceId
        - rating
      type: object
      properties:
        resourceId:
          type: string
        rating:
          type: integer
          description: The rating of the resource, can be an integer between 1 and 100
          format: int32
    AllocationShape:
      required:
        - id
        - start
        - locked
        - duration
        - attributeRequirements
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this allocation
        start:
          type: string
          description: The scheduled start time of this shift
          format: date-time
        locked:
          type: boolean
          description: If true, the assigned resource cannot be changed by the optimizer
        duration:
          type: integer
          description: Duration of the shift in minutes
          format: int64
        resourceId:
          type: string
          description: The resource currently assigned to this allocation, if any
        locationId:
          type: string
          description: The location at which this allocation takes place
        priority:
          type: integer
          description: >-
            Priority of this allocation (1-100); higher values cause the
            optimizer to prefer assigning this allocation over lower-priority
            ones
          format: int32
        attributeRequirements:
          type: array
          items:
            $ref: '#/components/schemas/AttributeRequirementsShape'
          description: >-
            Attributes a resource must or preferably should have to be assigned
            to this allocation
        resourceConstraints:
          $ref: '#/components/schemas/ResourceConstraintsShape'
        preferredResourceIds:
          type: array
          items:
            type: string
          description: >-
            Ordered list of preferred resources for this allocation; the
            optimizer will prefer resources appearing earlier in the list
    AllocationShape1:
      required:
        - id
        - groupIds
        - duration
        - locked
        - attributeRequirements
        - scheduleConstraints
        - resourceRatings
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this allocation
        groupId:
          type: string
          description: The allocation group if an allocation belongs to a single group
        groupIds:
          type: array
          items:
            type: string
          description: The allocation groups if an allocation belongs to multiple groups
        start:
          type: string
          description: >-
            The currently scheduled start time, if the allocation has already
            been scheduled
          format: date-time
        resourceId:
          type: string
          description: The resource currently assigned to this allocation, if any
        locationId:
          type: string
          description: The location at which this allocation takes place
        duration:
          type: integer
          description: The duration of the allocation in minutes
          format: int64
        locked:
          type: boolean
          description: >-
            If the allocation is locked, the start time and resourceId cannot be
            reassigned
        attributeRequirements:
          type: array
          items:
            $ref: '#/components/schemas/AllocationAttributeShape'
          description: >-
            Attributes a resource must or preferably should have to be assigned
            to this allocation
        resourceConstraints:
          $ref: '#/components/schemas/AllocationResourceConstraintShape'
        scheduleConstraints:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleTimeConstraintShape'
          description: >-
            Time windows within which this allocation must be scheduled; the
            allocation's start time must fall within one of these windows
        resourceRatings:
          type: array
          items:
            $ref: '#/components/schemas/AllocationResourceRatingShape'
          description: >-
            The rating of resources for this specific job. If present this will
            override the rating field on resources for this job.
        priority:
          type: integer
          description: >-
            Priority of this allocation (1-100); higher values cause the
            optimizer to prefer assigning this allocation over lower-priority
            ones
          format: int32
        urgency:
          type: integer
          description: >-
            Urgency of this allocation (1-100); higher values cause the
            optimizer to schedule the allocation closer to the start of its time
            windows
          format: int32
        phaseTags:
          type: array
          items:
            type: string
          description: >-
            Phase tags that restrict this allocation to specific phases. If
            absent or empty, the allocation is included in all phases.
    AttributeRequirementsShape:
      required:
        - id
      type: object
      properties:
        id:
          type: string
          description: >-
            The attribute identifier that the resource must or preferably should
            have
        weighting:
          type: integer
          description: >-
            If present, this is a soft (preferred) requirement with the given
            weighting (1-10000); if absent, this is a hard (required) attribute
          format: int32
    AttributeShape:
      required:
        - id
      type: object
      properties:
        id:
          type: string
          description: The attribute identifier
        validFor:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValidityPeriodShape'
          description: >-
            Validity periods for this attribute; absent means the attribute is
            always valid
        weighting:
          type: integer
          description: >-
            Preference weighting for this attribute (1-10000); used in soft
            skill scoring to rank resources when the attribute is a preferred
            rather than required requirement
          format: int32
    AttributeValidityPeriodShape:
      type: object
      properties:
        from:
          type: string
          description: >-
            Start date from which this attribute is valid (inclusive); absent
            means valid from the beginning of time
          format: date
        to:
          type: string
          description: >-
            End date after which this attribute is no longer valid (exclusive);
            absent means no expiry
          format: date
    Availability:
      required:
        - start
        - end
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    BoundedIntervalInstantShape:
      required:
        - start
        - end
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    BreakShape:
      oneOf:
        - $ref: '#/components/schemas/FixedTimeBreakShape'
        - $ref: '#/components/schemas/WindowedBreakShape'
    Change:
      required:
        - deleteAllocationsIds
        - insertAllocations
        - updateJobs
      type: object
      properties:
        deleteAllocationsIds:
          type: array
          items:
            type: string
        insertAllocations:
          type: array
          items:
            $ref: '#/components/schemas/InsertJobAllocations'
        updateJobs:
          type: array
          items:
            $ref: '#/components/schemas/UpdateJobs'
    ComparisonTotal:
      required:
        - planned
        - scheduled
      type: object
      properties:
        planned:
          type: integer
          format: int32
        scheduled:
          type: integer
          format: int32
    CorePVRPDiffShape:
      required:
        - solver
        - allocations
      type: object
      properties:
        solver:
          type: string
          enum:
            - pvrp
        allocations:
          $ref: '#/components/schemas/Map_DiffScheduleShape'
        meta:
          type: object
          description: Arbitrary JSON object (key/value pairs)
          additionalProperties:
            description: Any JSON value (string, number, boolean, null, object, or array)
    CorePVRPFeatureModelResultsShape:
      required:
        - type
        - scheduled
        - unscheduled
      type: object
      properties:
        type:
          type: string
          description: Identifies the solver type; always 'pvrp' for CorePVRP results
        scheduled:
          $ref: '#/components/schemas/Map_CorePVRPScheduledAllocationShape'
        unscheduled:
          $ref: '#/components/schemas/Map_CorePVRPUnscheduledAllocationShape'
    CorePVRPFeatureModelShape:
      required:
        - allocations
        - groups
        - resources
        - allocationDependencies
        - resourceDependencies
        - locations
        - schedulingPeriod
        - rollingSchedulingPeriods
        - timezone
        - options
        - solver
        - sharedGroupConstraints
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationShape1'
          description: Allocations to be optimized, each to one resource
        groups:
          type: array
          items:
            $ref: '#/components/schemas/AllocationGroupShape'
          description: Groups of allocations that should be synchronized by time
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceShape1'
          description: Resources that can be allocated to
        allocationDependencies:
          type: array
          items:
            $ref: '#/components/schemas/AllocationDependencyShape'
          description: >-
            Contains pairs of allocations which must be scheduled within a
            certain time of each other
        resourceDependencies:
          type: array
          items:
            $ref: '#/components/schemas/ResourceDependencyShape'
          description: >-
            Contains sets of allocations which must be allocated to the same
            resource
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationShape2'
          description: >-
            All the locations included in the model for both allocations and
            resources
        schedulingPeriod:
          $ref: '#/components/schemas/ScheduleRunWindow'
        rollingSchedulingPeriods:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRunWindow'
          description: >-
            Optional sub-windows used for rolling schedule optimization; the
            scheduling period is split into these periods and each is solved
            sequentially
        timezone:
          type: string
          description: The timezone used for date-based period constraint calculations
        options:
          $ref: '#/components/schemas/PVRPFeatureOptionsShape'
        meta:
          type: object
          description: >-
            Additional metadata for the model. For route optimization the
            default shape is ProductMeta, which contains: 'allocations' — a map
            from CorePVRP allocation ID to either a Job reference (jobId,
            optional initial resource/allocation IDs, optional
            resourceRequirementId) or an Activity reference (activityId);
            'frozenJobs' — a map from job ID to the reasons it was excluded from
            optimization (e.g. has dependencies outside scope, outside region,
            not in requested jobs); 'activityBreaks' — a map from activity ID to
            the resource and fixed-time break period for activities that
            represent resource breaks.
          additionalProperties:
            description: Any JSON value (string, number, boolean, null, object, or array)
        solver:
          type: string
          description: Identifies the solver type; always 'pvrp' for CorePVRP models
          enum:
            - pvrp
        phases:
          type: array
          items:
            $ref: '#/components/schemas/PhaseConfigurationShape'
          description: >-
            Optional ordered list of phases for strict prioritization. Each
            phase is either 'all' (every object is active) or 'filtered'
            (per-object-type tag filters control which objects are active).
            Phases are processed in order and allocations assigned during one
            phase are locked for subsequent phases.
        sharedGroupConstraints:
          type: array
          items:
            $ref: '#/components/schemas/SharedGroupConstraintShape'
          description: >-
            Collective allocation limits shared across a filtered set of
            resources. Unlike per-resource groupConstraints, each entry caps the
            total allocations of a group across all listed resources combined (a
            shared pool), regardless of how they are distributed. Every resource
            in the pool shares the exact same period and limit.
    CorePVRPRunParamsShape:
      required:
        - options
        - resourceIds
        - jobIds
        - scheduleWindow
        - timezone
        - respectSchedule
      type: object
      properties:
        options:
          $ref: '#/components/schemas/PVRPFeatureOptionsShape'
        resourceIds:
          type: array
          items:
            type: string
        jobIds:
          type: array
          items:
            type: string
        regionId:
          type: string
        scheduleWindow:
          $ref: '#/components/schemas/ScheduleRunWindow'
        timezone:
          type: string
        respectSchedule:
          type: boolean
        recipeId:
          type: string
    CorePVRPScheduledAllocationShape:
      required:
        - start
        - resourceId
        - infeasibilityReasons
        - feasibleGaps
      type: object
      properties:
        start:
          type: string
          description: The scheduled start time of this allocation
          format: date-time
        resourceId:
          type: string
          description: The resource assigned to this allocation
        infeasibilityReasons:
          type: array
          items:
            $ref: '#/components/schemas/InfeasibilityReasonShape'
          description: >-
            Infeasibility reasons recorded against this allocation even though
            it was scheduled; present when the allocation is scheduled but
            constraints prevent it from being reassigned to other resources
        feasibleGaps:
          $ref: '#/components/schemas/Map_List_FeasibleGapShape'
    CorePVRPSuggestionShape:
      required:
        - resourceId
        - allocationId
        - suggestedStart
        - score
      type: object
      properties:
        resourceId:
          type: string
        allocationId:
          type: string
        suggestedStart:
          type: string
          format: date-time
        score:
          $ref: '#/components/schemas/ScoreShape'
    CorePVRPUnscheduledAllocationShape:
      required:
        - reasons
        - feasibleGaps
      type: object
      properties:
        previousStart:
          type: string
          description: >-
            The start time this allocation had before the optimization run, if
            it was previously scheduled
          format: date-time
        previousResourceId:
          type: string
          description: >-
            The resource this allocation was previously assigned to before the
            optimization run, if any
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/InfeasibilityReasonShape'
          description: The reasons why this allocation could not be scheduled
        feasibleGaps:
          $ref: '#/components/schemas/Map_List_FeasibleGapShape'
    Daily:
      required:
        - step
        - repeatMode
      type: object
      properties:
        step:
          type: integer
          format: int32
        repeatMode:
          type: string
          description: '`daily`'
        endAfterNumberOccurrences:
          type: integer
          format: int32
        endOn:
          type: string
          format: date
      description: recurringFieldsDescription
    Day:
      required:
        - Date
        - Locations
        - TravelTime
        - TravelDistance
      type: object
      properties:
        Date:
          type: string
          format: date
        Locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        TravelTime:
          type: integer
          format: int64
        TravelDistance:
          type: integer
          format: int64
    Deprecated:
      required:
        - reason
      type: object
      properties:
        reason:
          type: string
    DiffAllocationShape:
      type: object
      properties:
        deallocation:
          type: string
        allocation:
          type: string
    DiffScheduleShape:
      type: object
      properties:
        deallocation:
          type: string
        allocation:
          type: string
        initialScheduleTime:
          type: string
          format: date-time
        scheduleTime:
          type: string
          format: date-time
    DiffShape:
      oneOf:
        - $ref: '#/components/schemas/ARCShiftDiffShape'
        - $ref: '#/components/schemas/CorePVRPDiffShape'
    Error:
      required:
        - runId
        - state
        - autoSaved
        - message
      type: object
      properties:
        runId:
          type: string
        state:
          type: string
          description: '`error`'
        autoSaved:
          type: boolean
        message:
          type: string
        meta:
          $ref: '#/components/schemas/SaveMeta'
    ExceptionFilterShape:
      required:
        - blacklist
        - resourceAvailability
      type: object
      properties:
        blacklist:
          type: boolean
          description: >-
            If true, allocations assigned by the solver to explicitly blocked
            resources will be discarded from the result
        resourceAvailability:
          type: boolean
          description: >-
            If true, allocations assigned by the solver to resources outside
            their availability windows will be discarded from the result
      description: >-
        Controls which types of constraint violation cause the optimizer to
        discard a proposed assignment from the result
    ExhaustedAvailability:
      required:
        - type
        - resourceId
      type: object
      properties:
        type:
          type: string
          description: '`resource_exhausted_availability`'
          enum:
            - resource_exhausted_availability
        resourceId:
          type: string
          description: >-
            The resource that has no remaining availability to accommodate this
            job
      description: >-
        The resource has no remaining availability in the scheduling period that
        could accommodate this job
    ExhaustedAvailabilityPeriod:
      required:
        - type
        - resourceId
        - start
        - end
        - gaps
        - allocationDurationFeasibleGaps
        - gapsExceedingMaximumTravelTime
      type: object
      properties:
        type:
          type: string
          description: '`exhausted_availability_period`'
          enum:
            - exhausted_availability_period
        resourceId:
          type: string
          description: The resource whose availability is exhausted in the given period
        start:
          type: string
          description: >-
            Start of the period in which the resource has no remaining
            availability
          format: date-time
        end:
          type: string
          description: >-
            End of the period in which the resource has no remaining
            availability
          format: date-time
        gaps:
          type: integer
          description: Total number of free gaps in this period that were evaluated
          format: int32
        allocationDurationFeasibleGaps:
          type: integer
          description: Number of gaps large enough to fit the allocation duration
          format: int32
        gapsExceedingMaximumTravelTime:
          type: integer
          description: >-
            Number of gaps where travel time to or from the gap exceeds the
            maximum allowed
          format: int32
        maxExcessiveTravelOrWaitTimeSeconds:
          type: integer
          description: >-
            Maximum excess travel or wait time in seconds across all evaluated
            gaps
          format: int64
        minExcessiveTravelOrWaitTimeSeconds:
          type: integer
          description: >-
            Minimum excess travel or wait time in seconds across all evaluated
            gaps
          format: int64
      description: >-
        The resource has no remaining free time in the given period that could
        accommodate this allocation, taking into account travel time, padding,
        snapping and the allocation duration.
    ExhaustedPeriodGroupConstraint:
      required:
        - type
        - resourceId
        - start
        - end
        - groupId
      type: object
      properties:
        type:
          type: string
          description: '`exhausted_period_group_constraint`'
          enum:
            - exhausted_period_group_constraint
        resourceId:
          type: string
          description: >-
            The resource that has reached the maximum number of allocations from
            this group in the given period
        start:
          type: string
          description: Start of the period in which the group constraint is exhausted
          format: date-time
        end:
          type: string
          description: End of the period in which the group constraint is exhausted
          format: date-time
        groupId:
          type: string
          description: >-
            The allocation group whose per-period limit has been reached for
            this resource
      description: >-
        The resource has reached the maximum number of allocations from this
        allocation group allowed within the given period constraint.
    ExhaustedPeriodServiceTime:
      required:
        - type
        - resourceId
        - start
        - end
      type: object
      properties:
        type:
          type: string
          description: '`exhausted_period_service_time`'
          enum:
            - exhausted_period_service_time
        resourceId:
          type: string
          description: >-
            The resource that has reached its maximum service time in the given
            period
        start:
          type: string
          description: >-
            Start of the period in which the resource has exhausted its maximum
            service time
          format: date-time
        end:
          type: string
          description: >-
            End of the period in which the resource has exhausted its maximum
            service time
          format: date-time
      description: >-
        The resource has reached its maximum allowed service (working) time
        within the given period, so assigning this allocation would exceed the
        period constraint.
    ExtraneousResource:
      required:
        - type
        - resourceId
      type: object
      properties:
        type:
          type: string
          description: '`resource_extraneous`'
          enum:
            - resource_extraneous
        resourceId:
          type: string
          description: The resource that is outside the scope of this optimization run
      description: >-
        The resource was not in the optimization request scope but was added to
        the model because it already had allocations; it cannot be assigned any
        new work
    FairnessBucketShape:
      required:
        - start
        - end
        - resourceIds
        - allocationIds
      type: object
      properties:
        start:
          type: string
          description: Start of the fairness period
          format: date-time
        end:
          type: string
          description: End of the fairness period
          format: date-time
        resourceIds:
          type: array
          items:
            type: string
          description: Resources whose working time should be balanced within this period
        allocationIds:
          type: array
          items:
            type: string
          description: >-
            Allocations to consider when measuring workload for fairness
            balancing
        targetInMinutes:
          type: integer
          description: >-
            Target working time per resource in minutes; if absent, total
            allocation time is distributed evenly across the listed resources
          format: int64
    FeasibleGapShape:
      required:
        - start
        - end
      type: object
      properties:
        start:
          type: string
          description: Start of the feasible gap interval
          format: date-time
        end:
          type: string
          description: End of the feasible gap interval
          format: date-time
        previousLocation:
          $ref: '#/components/schemas/LocationShape'
        nextLocation:
          $ref: '#/components/schemas/LocationShape'
    FeatureModelResultsShape:
      oneOf:
        - $ref: '#/components/schemas/ARCShiftFeatureModelResultsShape'
        - $ref: '#/components/schemas/CorePVRPFeatureModelResultsShape'
    FeatureModelShape:
      oneOf:
        - $ref: '#/components/schemas/ARCShiftModelShape'
        - $ref: '#/components/schemas/CorePVRPFeatureModelShape'
    FeatureSuggestResponseShape:
      required:
        - suggestions
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/CorePVRPSuggestionShape'
    FixedTimeBreakShape:
      required:
        - startTime
        - endTime
      type: object
      properties:
        startTime:
          type: string
          description: The fixed start time of the break
          format: date-time
        endTime:
          type: string
          description: The fixed end time of the break
          format: date-time
        locationId:
          type: string
          description: >-
            Optional location where the resource will be during this break;
            affects travel time calculations for surrounding allocations
    FrozenJobReason:
      description: >-
        The specific reason why this job was excluded from the optimization
        scope
      oneOf:
        - $ref: '#/components/schemas/Deprecated'
        - $ref: '#/components/schemas/HasJobDependenciesNotInScope'
        - $ref: '#/components/schemas/NotInRequestedJobs'
        - $ref: '#/components/schemas/OutsideOfRegion'
    GraphQLAccountResourceScore:
      required:
        - AccountId
        - ResourceId
        - Blacklisted
      type: object
      properties:
        AccountId:
          type: string
        ResourceId:
          type: string
        Blacklisted:
          type: boolean
    GraphQLActivity:
      required:
        - UID
        - Start
        - End
        - ActivityResources
      type: object
      properties:
        UID:
          type: string
        Start:
          type: string
          format: date-time
        End:
          type: string
          format: date-time
        LocationId:
          type: string
        GeoLatitude:
          type: number
          format: double
        GeoLongitude:
          type: number
          format: double
        ResourceId:
          type: string
        ActivityResources:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLActivityResource'
    GraphQLActivityResource:
      required:
        - resourceId
      type: object
      properties:
        resourceId:
          type: string
    GraphQLJob:
      required:
        - UID
        - Duration
        - JobStatus
        - JobAllocations
        - JobTags
        - ResourceRequirements
        - JobTimeConstraints
        - JobDependenciesFrom
        - JobDependenciesTo
        - Locked
        - RegionId
      type: object
      properties:
        UID:
          type: string
        Start:
          type: string
          format: date-time
        Duration:
          type: integer
        AccountId:
          type: string
        JobStatus:
          $ref: '#/components/schemas/JobStatus'
        LocationId:
          type: string
        GeoLatitude:
          type: number
          format: double
        GeoLongitude:
          type: number
          format: double
        Quantity:
          type: integer
          format: int32
        JobAllocations:
          type: array
          items:
