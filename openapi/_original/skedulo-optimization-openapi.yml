  /run/{runId}/results:
    get:
      summary: Get results of an optimization run
      description: >-
        Returns the feature-model-level optimization results for a completed
        run. For ARCShift (shift scheduling) runs this shows which allocations
        were assigned to resources and which were left unscheduled. For CorePVRP
        (route optimization) runs this additionally includes the scheduled start
        times and per-allocation infeasibility reasons explaining why each
        resource could not be used for each unscheduled allocation.
      operationId: Get Run Results
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                  - result
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/FeatureModelResultsShape'
      security:
        - httpAuth: []
