        - includeSecondaryRegions
        - createdByUserId
        - createdByDate
        - lastModifiedByUserId
        - lastModifiedByDate
      type: object
      properties:
        name:
          type: string
        optimizationType:
          type: string
          enum:
            - pvrp
        status:
          type: string
          enum:
            - deleted
        runDate:
          type: string
          format: date
        timezone:
          type: string
        earliestStartTime:
          type: string
        latestEndTime:
          type: string
        recurring:
          $ref: '#/components/schemas/Recurring'
        dayRange:
          type: integer
          format: int32
        dayOffset:
          type: integer
          format: int32
        jobQuery:
          type: string
        resourceQuery:
          type: string
        region:
          type: string
        schedulingOptions:
          $ref: '#/components/schemas/PVRPProductOptionsShape'
        persistenceStrategy:
          type: string
          enum:
            - save
            - optimize
        includeTemporaryRegions:
          type: boolean
        includeSecondaryRegions:
          type: boolean
        createdByUserId:
          type: string
        createdByDate:
          type: string
          format: date-time
        lastModifiedByUserId:
          type: string
        lastModifiedByDate:
          type: string
          format: date-time
    ScheduleRequestShape:
      required:
        - plan
        - persistenceStrategy
        - optimizationType
      type: object
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        label:
          type: string
        persistenceStrategy:
          type: string
          enum:
            - save
            - optimize
        optimizationType:
          type: string
          enum:
            - pvrp
    ScheduleResult:
      required:
        - id
      type: object
      properties:
        id:
          type: string
    ScheduleRunWindow:
      required:
        - start
        - end
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    ScheduleShape:
      required:
        - name
        - runDate
        - timezone
        - earliestStartTime
        - optimizationType
        - region
        - dayRange
        - dayOffset
        - schedulingOptions
      type: object
      properties:
        name:
          type: string
        runDate:
          type: string
          description: Date the schedule will first run
          format: date
        timezone:
          type: string
        earliestStartTime:
          type: string
          description: Earliest time the schedule can start
        latestEndTime:
          type: string
        recurring:
          $ref: '#/components/schemas/Recurring'
        persistenceStrategy:
          type: string
          description: Whether the optimization results will be autosaved
          enum:
            - save
            - optimize
        optimizationType:
          type: string
          enum:
            - pvrp
        region:
          type: string
        jobQuery:
          type: string
          description: EQL filter for jobs to include in the optimization
        resourceQuery:
          type: string
          description: EQL filter for resources to include in the optimization
        dayRange:
          type: integer
          description: Number of days to include in the scheduling window
          format: int32
        dayOffset:
          type: integer
          description: Number of days after the run date to start the scheduling window
          format: int32
        schedulingOptions:
          $ref: '#/components/schemas/PVRPProductOptionsShape'
        includeTemporaryRegions:
          type: boolean
        includeSecondaryRegions:
          type: boolean
    ScheduleTimeConstraintShape:
      required:
        - windowStart
        - windowEnd
      type: object
      properties:
        windowStart:
          type: string
          description: >-
            Start of the time window within which this allocation must be
            scheduled
          format: date-time
        windowEnd:
          type: string
          description: >-
            End of the time window within which this allocation must be
            scheduled
          format: date-time
    ScheduledJob:
      required:
        - start
        - resourceRequirements
        - excluded
        - requiredAllocationCount
        - resourceIds
        - reasons
      type: object
      properties:
        start:
          type: string
          description: The scheduled start time of the job
          format: date-time
        resourceRequirements:
          $ref: '#/components/schemas/Map_ScheduledResourceRequirement'
        excluded:
          type: boolean
          description: >-
            If true, this job was only partially allocated — some resource
            requirements could not be fulfilled
        requiredAllocationCount:
          type: integer
          description: >-
            Total number of resource allocations required for this job to be
            fully scheduled
          format: int32
        resourceIds:
          type: array
          items:
            type: string
          description: Resource IDs assigned to this job
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/UnscheduledReason'
          description: >-
            Reasons why some allocations could not be fulfilled; present when
            the job is only partially allocated
    ScheduledResourceRequirement:
      required:
        - resourceIds
        - requiredAllocationCount
      type: object
      properties:
        resourceIds:
          type: array
          items:
            type: string
          description: Resource IDs assigned to satisfy this resource requirement
        requiredAllocationCount:
          type: integer
          description: >-
            Number of resource allocations required to fully satisfy this
            resource requirement
          format: int32
    Scope:
      required:
        - schedulingRegions
        - regions
        - jobs
        - resources
        - scheduleBounds
      type: object
      properties:
        schedulingRegions:
          type: array
          items:
            $ref: '#/components/schemas/ScopeRegion'
        regions:
          type: array
          items:
            type: string
        jobs:
          $ref: '#/components/schemas/ScopeJobs'
        resources:
          $ref: '#/components/schemas/Map_ResourceId_ScopeResource'
        scheduleBounds:
          $ref: '#/components/schemas/TimeBounds'
    ScopeJobs:
      required:
        - scoped
        - requested
        - partiallyAllocated
        - locked
        - timeConstrained
        - timeConstrainedOutsideScheduleWindow
        - excludedInSchedule
        - unscheduledExcluded
      type: object
      properties:
        scoped:
          type: array
          items:
            type: string
        requested:
          type: array
          items:
            type: string
        partiallyAllocated:
          type: array
          items:
            type: string
        locked:
          type: array
          items:
            type: string
        timeConstrained:
          type: array
          items:
            type: string
        timeConstrainedOutsideScheduleWindow:
          type: array
          items:
            type: string
        excludedInSchedule:
          type: array
          items:
            type: string
        unscheduledExcluded:
          type: array
          items:
            type: string
    ScopeRegion:
      required:
        - regionId
        - timezone
      type: object
      properties:
        regionId:
          type: string
        timezone:
          type: string
    ScopeRequest:
      required:
        - jobs
        - scheduleBounds
        - recipeId
      type: object
      properties:
        jobs:
          type: array
          items:
            type: string
        scheduleBounds:
          $ref: '#/components/schemas/LocalDateBounds'
        recipeId:
          type: string
    ScopeResource:
      required:
        - activities
        - existingAllocations
      type: object
      properties:
        activities:
          type: array
          items:
            type: string
        existingAllocations:
          type: array
          items:
            type: string
    ScoreShape:
      required:
        - hard
        - medium
        - soft
      type: object
      properties:
        hard:
          type: number
          format: double
        medium:
          type: number
          format: double
        soft:
          type: number
          format: double
      description: Raw solver penalty breakdown; lower is better, 0 is ideal.
    SharedAttributesShape:
      required:
        - id
        - allocations
        - attributeId
        - minimumQuantity
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this shared attribute requirement
        allocations:
          type: array
          items:
            type: string
          description: >-
            The allocations that must collectively satisfy this attribute
            requirement
        attributeId:
          type: string
          description: The attribute that the assigned resources must hold
        minimumQuantity:
          type: integer
          description: >-
            Minimum number of the listed allocations that must be assigned to
            resources holding the specified attribute
          format: int32
    SharedGroupConstraintShape:
      required:
        - groupId
        - resourceIds
        - maxAllocations
        - start
        - end
      type: object
      properties:
        groupId:
          type: string
          description: The allocation group identifier the pooled limit applies to
        resourceIds:
          type: array
          items:
            type: string
          description: The resources that share the pooled limit
        maxAllocations:
          type: integer
          description: >-
            Maximum number of allocations from this group across all listed
            resources combined within the period
          format: int32
        start:
          type: string
          description: Start of the period the pooled limit applies to
          format: date-time
        end:
          type: string
          description: End of the period the pooled limit applies to
          format: date-time
    ShiftFeatureOptionsShape:
      required:
        - locations
      type: object
      properties:
        locations:
          type: boolean
          description: >-
            If true, location data is used to calculate travel times between
            allocations and resource home locations
        exceptionFilter:
          $ref: '#/components/schemas/ExceptionFilterShape'
        solviceWeights:
          $ref: '#/components/schemas/SolviceWeightsShape'
      description: Configuration options controlling the shift optimization behaviour
    SolveResult:
      required:
        - id
      type: object
      properties:
        id:
          type: string
    SolviceWeightsShape:
      type: object
      properties:
        maxHours:
          type: string
        minHours:
          type: string
        minHoursUnassigned:
          type: string
        availability:
          type: string
        locked:
          type: string
        minRest:
          type: string
        requirements:
          type: string
        skills:
          type: string
        distance:
          type: string
        distanceAL:
          type: string
        priority:
          type: string
        pref:
          type: string
        unassigned:
          type: string
        softSkills:
          type: string
        criticalSkills:
          type: string
        blacklist:
          type: string
        efficiency:
          type: string
        softSkillsLevel:
          type: string
        maxWorkingDays:
          type: string
        shiftStart:
          type: string
        latestShiftStart:
          type: string
        shiftEnd:
          type: string
        minShift:
          type: string
        maxShift:
          type: string
        dayOfWeek:
          type: string
        sameDay:
          type: string
        sameDayMinRest:
          type: string
        maxConsecutive:
          type: string
        concurrent:
          type: string
        costs:
          type: string
        wages:
          type: string
        working:
          type: string
        minWorkingDaysUnassigned:
          type: string
        fairness:
          type: string
      description: >-
        Fine-grained weight configuration passed directly to the underlying
        Solvice ShiftFill solver
    StringifiedRunError:
      required:
        - message
      type: object
      properties:
        message:
          type: string
    SuggestRequestShape:
      required:
        - jobId
        - resourceIds
        - suggestWindow
        - timezone
      type: object
      properties:
        jobId:
          type: string
        resourceRequirementId:
          type: string
        resourceIds:
          type: array
          items:
            type: string
        recipeId:
          type: string
        suggestWindow:
          $ref: '#/components/schemas/BoundedIntervalInstantShape'
        timezone:
          type: string
        persistenceStrategy:
          type: string
          enum:
            - save
            - optimize
    SuggestResponseShape:
      required:
        - suggestions
        - runId
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionShape'
        runId:
          type: string
    SuggestionShape:
      required:
        - jobId
        - score
        - resourceId
        - suggestedStartTime
      type: object
      properties:
        jobId:
          type: string
        score:
          type: number
          description: >-
            Effectiveness of this suggestion from 0 to 100, relative to the
            others in this response. 100 is the best suggestion; higher is
            better. Suggestions are returned in descending score order. A single
            suggestion always scores 100.
          format: double
        resourceRequirementId:
          type: string
        resourceId:
          type: string
        suggestedStartTime:
          type: string
          format: date-time
    TimeBounds:
      required:
