    TimeConstraintAfterPeriod:
      required:
        - type
      type: object
      properties:
        type:
          type: string
          description: '`job_time_constraint_late`'
          enum:
            - job_time_constraint_late
      description: >-
        All of the job's schedule time constraints fall entirely after the
        scheduling period
    TimeConstraintAfterPeriod1:
      required:
        - type
      type: object
      properties:
        type:
          type: string
          description: '`time_constraint_after_period`'
          enum:
            - time_constraint_after_period
      description: >-
        All of the allocation's schedule time constraints fall entirely after
        the scheduling period.
    TimeConstraintBeforePeriod:
      required:
        - type
      type: object
      properties:
        type:
          type: string
          description: '`job_time_constraint_early`'
          enum:
            - job_time_constraint_early
      description: >-
        All of the job's schedule time constraints fall entirely before the
        scheduling period
    TimeConstraintBeforePeriod1:
      required:
        - type
      type: object
      properties:
        type:
          type: string
          description: '`time_constraint_before_period`'
          enum:
            - time_constraint_before_period
      description: >-
        All of the allocation's schedule time constraints fall entirely before
        the scheduling period.
    TimeConstraintNoOverlap:
      required:
        - type
      type: object
      properties:
        type:
          type: string
          description: '`job_time_constraint_no_overlap`'
          enum:
            - job_time_constraint_no_overlap
      description: >-
        The job's schedule time constraints do not overlap with any resource's
        availability windows
    TimeConstraintNoOverlap1:
      required:
        - type
      type: object
      properties:
        type:
          type: string
          description: '`time_constraint_no_overlap`'
          enum:
            - time_constraint_no_overlap
      description: >-
        The allocation's schedule time constraints do not overlap with the
        scheduling period.
    TransformerDataResponseShape:
      required:
        - transformerLogId
        - productData
        - featureModel
      type: object
      properties:
        transformerLogId:
          type: string
        productData:
          $ref: '#/components/schemas/APIProductData'
        featureModel:
          $ref: '#/components/schemas/CorePVRPFeatureModelShape'
    TransformerDataShape:
      required:
        - productData
        - featureModel
      type: object
      properties:
        productData:
          $ref: '#/components/schemas/APIProductData'
        featureModel:
          $ref: '#/components/schemas/CorePVRPFeatureModelShape'
    Unknown:
      required:
        - type
        - duration
        - lat
        - lng
      type: object
      properties:
        type:
          type: string
        arrivalTime:
          type: string
          format: date-time
        departureTime:
          type: string
          format: date-time
        duration:
          type: integer
          format: int64
        travelTimeToNext:
          type: integer
          format: int64
        distanceToNext:
          type: integer
          format: int32
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
    UnscheduledJob:
      required:
        - reasons
        - missingAllocationCount
      type: object
      properties:
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/UnscheduledReason'
          description: The reasons why this job could not be scheduled
        missingAllocationCount:
          type: integer
          description: >-
            Number of resource allocations that could not be fulfilled for this
            job
          format: int32
    UnscheduledReason:
      oneOf:
        - $ref: '#/components/schemas/ExhaustedAvailability'
        - $ref: '#/components/schemas/ExtraneousResource'
        - $ref: '#/components/schemas/JobCannotBeFullyAllocated'
        - $ref: '#/components/schemas/JobExcluded'
        - $ref: '#/components/schemas/JobLocked'
        - $ref: '#/components/schemas/RequiredCustomAttributes'
        - $ref: '#/components/schemas/RequiredTags'
        - $ref: '#/components/schemas/ResourceAccountRestricted'
        - $ref: '#/components/schemas/ResourceCustomConstraintPeriod'
        - $ref: '#/components/schemas/ResourceExceedsMaximumHours'
        - $ref: '#/components/schemas/ResourceLocationRestricted'
        - $ref: >-
            #/components/schemas/ResourceNoAvailabilityOverlapWithTimeConstraints
        - $ref: '#/components/schemas/ResourceNoFeasibleWindow'
        - $ref: '#/components/schemas/ResourceNoReasonFound'
        - $ref: '#/components/schemas/ResourceRestricted'
        - $ref: '#/components/schemas/TimeConstraintAfterPeriod'
        - $ref: '#/components/schemas/TimeConstraintBeforePeriod'
        - $ref: '#/components/schemas/TimeConstraintNoOverlap'
    UpdateJobs:
      required:
        - jobId
      type: object
      properties:
        jobId:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    UserIdsShape:
      oneOf:
        - $ref: '#/components/schemas/InternalAdminUserId'
        - $ref: '#/components/schemas/VendorUserIds'
    VendorUserIds:
      required:
        - userId
        - vendorUserId
      type: object
      properties:
        userId:
          type: string
        vendorUserId:
          type: string
    VendorUserRecipeRequestShape:
      required:
        - name
        - description
        - objectiveWeights
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        objectiveWeights:
          $ref: '#/components/schemas/ObjectiveWeightsShape'
        options:
          $ref: '#/components/schemas/RecipeOptionsShape'
    Weekly:
      required:
        - step
        - repeatMode
        - repeatOnWeekDays
      type: object
      properties:
        step:
          type: integer
          format: int32
        repeatMode:
          type: string
          description: '`weekly`'
        repeatOnWeekDays:
          type: array
          items:
            type: string
            enum:
              - sun
              - mon
              - tue
              - wed
              - thu
              - fri
              - sat
        endAfterNumberOccurrences:
          type: integer
          format: int32
        endOn:
          type: string
          format: date
      description: recurringFieldsDescription
    WindowedBreakShape:
      required:
        - breakTimeInMinutes
        - minStartTime
        - maxStartTime
      type: object
      properties:
        breakTimeInMinutes:
          type: integer
          description: Duration of the break in minutes
          format: int64
        minStartTime:
          type: string
          description: Earliest time at which the break may start
          format: date-time
        maxStartTime:
          type: string
          description: Latest time at which the break may start
          format: date-time
    Yearly:
      required:
        - step
        - repeatMode
      type: object
      properties:
        step:
          type: integer
          format: int32
        repeatMode:
          type: string
          description: '`yearly`'
        endAfterNumberOccurrences:
          type: integer
          format: int32
        endOn:
          type: string
          format: date
      description: recurringFieldsDescription
