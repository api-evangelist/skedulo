openapi: 3.0.2
info:
  title: Virtual Meeting
  version: v1
  contact:
    email: support@skedulo.com
servers:
  - url: https://api.skedulo.com/virtualmeeting
  - url: https://api.uk.skedulo.com/virtualmeeting
  - url: https://api.ca.skedulo.com/virtualmeeting
  - url: https://api.au.skedulo.com/virtualmeeting
security:
  - BearerAuth: []
paths:
  /meetings:
    post:
      operationId: createMeeting
      summary: Create a virtual meeting hosted by a resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '400':
          description: The hosting resource has no email specified
  /meetings/{id}:
    get:
      operationId: getMeeting
      summary: Fetch information of the virtual meeting specified by the id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            description: Id of the virtual meeting to be fetched
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
    put:
      operationId: updateMeeting
      summary: Update the virtual meeting specified by the id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            description: Id of the virtual meeting to be updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseMeetingRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
    delete:
      operationId: deleteMeeting
      summary: Delete the virtual meeting specified by the id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            description: Id of the virtual meeting to be deleted
      responses:
        '204':
          description: Success
components:
  schemas:
    CreateMeetingRequest:
      allOf:
        - $ref: '#/components/schemas/BaseMeetingRequest'
        - type: object
          properties:
            hostResourceId:
              type: string
              description: Resource Id of the resource that hosts the virtual meeting
          required:
            - hostResourceId
    BaseMeetingRequest:
      type: object
      properties:
        topic:
          type: string
          description: Topic of the virtual meeting
        agenda:
          type: string
          description: Agenda of the virtual meeting
        startTime:
          type: string
          format: date-time
          description: Start time of the virtual meeting in ISO8601 format
        duration:
          type: integer
          description: Duration (in minutes) of the virtual meeting
        password:
          type: string
          description: Password of the virtual meeting
        zoom:
          type: object
          description: >-
            Optional Zoom specific information about the virtual meeting (when
            Zoom is the meeting provider). Most Zoom meetings can be created
            without this.
        teams:
          type: object
          description: >-
            Optional MS Teams specific information about the virtual meeting
            (when Teams is the meeting provider). Most Teams meetings can be
            created without this.
      required:
        - topic
        - agenda
        - startTime
        - duration
    MeetingResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            hostUrl:
              type: string
              format: uri
              description: URL for the host to join and start the meeting
            inviteeUrl:
              type: string
              format: uri
              description: URL for an invitee to join the meeting
            id:
              type: string
              description: Unique Id of the virtual meeting
            password:
              type: string
              description: Password of the virtual meeting
            zoom:
              type: object
              description: >-
                Zoom specific information about the virtual meeting (when Zoom
                is the meeting provider)
            teams:
              type: object
              description: >-
                MS Teams specific information about the virtual meeting (when
                Teams is the meeting provider)
          required:
            - hostUrl
            - inviteeUrl
            - id
      required:
        - result
