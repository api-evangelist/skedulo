openapi: 3.0.1
info:
  title: Rules Service
  version: 1.0.0
servers:
  - url: https://api.skedulo.com/rules
  - url: https://api.uk.skedulo.com/rules
  - url: https://api.ca.skedulo.com/rules
  - url: https://api.au.skedulo.com/rules
paths:
  /violation:
    put:
      tags:
        - Rule Violation Management
      summary: Insert or update a custom rule violation
      operationId: upsertCustomViolation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleViolationInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultBigInteger'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
    delete:
      tags:
        - Rule Violation Management
      summary: Delete a custom rule violation by key
      operationId: deleteCustomViolation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRuleViolationKeyInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultBigInteger'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
  /violations:
    put:
      tags:
        - Rule Violation Management
      summary: Batch insert or update custom rule violations
      operationId: upsertManyCustomViolation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleViolationsInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultListBigInteger'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
    delete:
      tags:
        - Rule Violation Management
      summary: Delete custom rule violations by key
      operationId: deleteCustomViolations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRuleViolationKeysInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultListBigInteger'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
  /violations/{tenantId}/resetOffsets:
    post:
      tags:
        - Rule Violation Management
      summary: >-
        Reset the change event offset of all core (non-custom) violations for a
        tenant to 0 so event and batch processing can update them again.
        Internal use only.
      operationId: resetViolationOffsets
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultResetViolationOffsetsResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
  /violations/search:
    post:
      tags:
        - Rule Violation Management
      summary: Find core and custom violations by filter criteria
      operationId: getViolationsForTargets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleViolationSearchInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultRuleViolationSearchResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
  /violations/findByTargetIds:
    post:
      tags:
        - Rule Violation Management
      summary: >-
        Find core and custom violations affecting a list of target objects.
        Warning: This endpoint does not support pagination of the results and is
        therefore deprecated. Please use the '/violations/search' endpoint
        instead.
      operationId: getViolationsForTargets_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleViolationTargetIdsInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultRuleViolationListResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      deprecated: true
      security:
        - ApiKeyAuth: []
  /violations/assignUser:
    post:
      tags:
        - Rule Violation Management
      summary: Assign a user to a core or custom violation
      operationId: assignViolationUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleViolationAssignUserInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultBigInteger'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
  /violations/assignStatus:
    post:
      tags:
        - Rule Violation Management
      summary: Assign a status to a core or custom violation
      operationId: assignViolationStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleViolationAssignStatusInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultBigInteger'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
  /asyncJobs/evaluateViolations:
    post:
      tags:
        - Async Job Management
      summary: Create a new async job for batch evaluating violations
      operationId: createEvaluateViolationsJobAndTasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateViolationsJobInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultJobIdResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
  /violations/{violationId}:
    get:
      tags:
        - Rule Violation Management
      summary: Find core and custom violations by violation id
      operationId: getViolationById
      parameters:
        - name: violationId
          in: path
          description: Rule violation ID
          required: true
          schema:
            type: integer
          example: 2756
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultRuleViolationResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
  /custom:
    get:
      tags:
        - Rule Violation Management
      summary: Get a list of the custom rules currently in use.
      operationId: getCustomRules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultListCustomRuleResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
  /asyncJobs/{asyncJobId}:
    get:
      tags:
        - Async Job Management
      summary: Get an async job by ID
      operationId: getJobById
      parameters:
        - name: asyncJobId
          in: path
          description: Async Job ID
          required: true
          schema:
            type: string
            format: uuid
          example: bebddd90-8f39-4d3d-8601-35f406f27db2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultAsyncJob'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
  /violations/{targetId}:
    delete:
      tags:
        - Rule Violation Management
      summary: Delete all custom rule violations for a specific object
      operationId: deleteCustomViolationByTargetId
      parameters:
        - name: targetId
          in: path
          description: Target ID
          required: true
          schema:
            type: string
          example: b055d7c1-ef2f-40e9-bcd2-634e9835e69b
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultListBigInteger'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
  /violations/rule/{ruleId}:
    delete:
      tags:
        - Rule Violation Management
      summary: Delete all custom rule violations for a given rule ID
      operationId: deleteCustomViolationByRuleId
      parameters:
        - name: ruleId
          in: path
          description: Rule ID
          required: true
          schema:
            type: string
          example: unsafeArea
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultListBigInteger'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
  /violation/{id}:
    delete:
      tags:
        - Rule Violation Management
      summary: Delete a custom rule violation by ID
      operationId: deleteCustomViolationById
      parameters:
        - name: id
          in: path
          description: Rule violation ID
          required: true
          schema:
            type: integer
          example: 2756
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultBigInteger'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      security:
        - ApiKeyAuth: []
components:
  schemas:
    ApiResultAsyncJob:
      required:
        - result
      type: object
      properties:
        result:
          $ref: '#/components/schemas/AsyncJob'
    ApiResultBigInteger:
      required:
        - result
      type: object
      properties:
        result:
          type: integer
    ApiResultJobIdResult:
      required:
        - result
      type: object
      properties:
        result:
          $ref: '#/components/schemas/JobIdResult'
    ApiResultListBigInteger:
      required:
        - result
      type: object
      properties:
        result:
          type: array
          items:
            type: integer
    ApiResultListCustomRuleResult:
      required:
        - result
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/CustomRuleResult'
    ApiResultResetViolationOffsetsResult:
      required:
        - result
      type: object
      properties:
        result:
          $ref: '#/components/schemas/ResetViolationOffsetsResult'
    ApiResultRuleViolationListResult:
      required:
        - result
      type: object
      properties:
        result:
          $ref: '#/components/schemas/RuleViolationListResult'
    ApiResultRuleViolationResult:
      required:
        - result
      type: object
      properties:
        result:
          $ref: '#/components/schemas/RuleViolationResult'
    ApiResultRuleViolationSearchResult:
      required:
        - result
      type: object
      properties:
        result:
          $ref: '#/components/schemas/RuleViolationSearchResult'
    AssignedToFilter:
      required:
        - includeUnassigned
      type: object
      properties:
        userIds:
          maxItems: 100
          minItems: 0
          uniqueItems: true
          type: array
          description: >-
            Include only violations that are assigned to these specific user
            IDs.
          items:
            type: string
            example: 44bb347c-457d-4dbe-be9c-a6c6fe5d57f5
        includeUnassigned:
          type: boolean
          description: If true, include violations that are not assigned to user IDs.
          example: true
      description: AssignedTo search filter parameters.
    AsyncJob:
      required:
        - createdBy
        - createdTime
        - jobId
        - parameters
        - status
        - tasks
        - type
      type: object
      properties:
        jobId:
          type: string
          description: Globally unique identifier for the async job
          format: uuid
          example: bebddd90-8f39-4d3d-8601-35f406f27db2
        type:
          type: string
          description: The job type of the async job
          example: BatchEvaluateViolations
          enum:
            - BatchEvaluateViolations
        status:
          type: string
          description: The current status of the async job
          example: Queued
          enum:
            - Queued
            - InProgress
            - Completed
            - CompletedWithErrors
        createdBy:
          type: string
          description: The ID of the user that created the async job
        createdTime:
          type: string
          description: The timestamp indicating when the job was created
          format: date-time
          example: '2022-01-01T09:00:00Z'
        inProgressTime:
          type: string
          description: The timestamp indicating when the job started processing
          format: date-time
          example: '2022-01-01T09:15:00Z'
        completedTime:
          type: string
          description: The timestamp indicating when the job completed processing
          format: date-time
          example: '2022-01-01T09:30:00Z'
        parameters:
          $ref: '#/components/schemas/AsyncJobParameters'
        tasks:
          $ref: '#/components/schemas/AsyncJobTasks'
      description: Summary details of an async job.
    AsyncJobParameters:
      required:
        - type
      type: object
      properties:
        type:
          type: string
          description: The type of async job
          example: BatchEvaluateViolations
          enum:
            - BatchEvaluateViolations
      description: The parameters specified when creating the job
      discriminator:
        propertyName: type
    AsyncJobTasks:
      required:
        - failure
        - inProgress
        - queued
        - success
        - total
      type: object
      properties:
        total:
          type: integer
          description: Total number of tasks
          format: int32
          example: 22
        queued:
          type: integer
          description: Number of tasks with a 'Queued' status
          format: int32
          example: 10
        inProgress:
          type: integer
          description: Number of tasks with an 'InProgress' status
          format: int32
          example: 5
        success:
          type: integer
          description: Number of tasks with a 'Success' status
          format: int32
          example: 5
        failure:
          type: integer
          description: Number of tasks with a 'Failure' status
          format: int32
          example: 2
      description: A summary of the tasks associated with the job
    CustomContext:
      required:
        - _type
      type: object
      description: A JSON object containing extra information for the violation
      example:
        jobAllocationCount: 3
      allOf:
        - $ref: '#/components/schemas/RuleViolationContext'
    CustomRuleResult:
      required:
        - id
      type: object
      properties:
        id:
          type: string
          description: Identifier for the rule.
          example: unsafeArea
      description: Details of a custom rule.
    CustomRuleViolationKeyInput:
      required:
        - ruleId
        - sourceId
        - targetId
      type: object
      properties:
        ruleId:
          type: string
          description: The type of rule that was violated.
          example: unsafeArea
        targetId:
          type: string
          description: The UID of the object that the rule violation affects.
          example: b055d7c1-ef2f-40e9-bcd2-634e9835e69b
        sourceId:
          type: string
          description: >-
            The UID of the object that caused rule violation (may be the same as
            the target).
          example: 5c832cd6-006b-454a-b747-5cb62beef885
      description: Uniquely identifies a Custom Rule Violation.
    CustomRuleViolationKeysInput:
      required:
        - keys
      type: object
      properties:
        keys:
          maxItems: 100
          minItems: 0
          type: array
          description: The type of rule that was violated.
          example: unsafeArea
          items:
            $ref: '#/components/schemas/CustomRuleViolationKeyInput'
      description: A list of violation keys.
    ErrorDetails:
      type: object
      properties:
        errorType:
          type: string
        message:
          type: string
    EvaluateViolationsJobInput:
      required:
        - endTime
        - ruleIds
        - startTime
      type: object
      properties:
        startTime:
          type: string
          description: Start of the evaluation time window
          format: date-time
          example: '2022-07-04T12:00:00Z'
        endTime:
          type: string
          description: End of the evaluation time window
          format: date-time
          example: '2022-08-04T12:00:00Z'
        ruleIds:
          $ref: '#/components/schemas/RuleIdFilter'
      description: Details of the async job to be created
    EventDetails:
      type: object
    ExternalRuleViolationLink:
      required:
        - name
        - type
        - url
      type: object
      allOf:
        - $ref: '#/components/schemas/RuleViolationLink'
        - type: object
          properties:
            name:
              type: string
            url:
              maxLength: 255
              minLength: 1
              type: string
              description: The url of the link.
              example: www.external.com
    IncludeAllRuleId:
      required:
        - include
      type: object
      description: Includes all rule ids.
      allOf:
        - $ref: '#/components/schemas/RuleIdFilter'
    IncludeOnlyRuleId:
      required:
        - ids
        - include
      type: object
      description: Includes only specified rule ids.
      allOf:
        - $ref: '#/components/schemas/RuleIdFilter'
        - type: object
          properties:
            ids:
              maxItems: 100
              minItems: 0
              uniqueItems: true
              type: array
              description: Include only violations that match these specific rule ids.
              items:
                maxLength: 255
                minLength: 1
                type: string
                example: unsafeArea
    IncludeType:
      type: string
      enum:
        - all
        - only
    InsufficientTravelTimeActivity:
      required:
        - details
        - type
      type: object
      description: The activity
      allOf:
        - $ref: '#/components/schemas/InsufficientTravelTimeEvent'
        - type: object
          properties:
            details:
              $ref: '#/components/schemas/InsufficientTravelTimeActivityDetails'
    InsufficientTravelTimeActivityDetails:
      required:
        - end
        - name
        - start
        - uid
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        type:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      description: The details of the activity.
    InsufficientTravelTimeContext:
      required:
        - _type
        - resource
      type: object
      description: >-
        Details of the insufficient travel time violation. Fields correspond to
        those in the Skedulo data model, unless stated otherwise.
      allOf:
        - $ref: '#/components/schemas/RuleViolationContext'
        - type: object
          properties:
            resource:
              $ref: '#/components/schemas/InsufficientTravelTimeResource'
    InsufficientTravelTimeEvent:
      required:
        - details
        - type
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InsufficientTravelTimeEventType'
        details:
          $ref: '#/components/schemas/EventDetails'
      description: >-
        The timeline event (work item or home visit) assigned to a resource with
        insufficient travel time.
      discriminator:
        propertyName: type
        mapping:
          Job: '#/components/schemas/InsufficientTravelTimeJobAllocation'
          Activity: '#/components/schemas/InsufficientTravelTimeActivity'
          HomeVisit: '#/components/schemas/InsufficientTravelTimeHomeVisit'
    InsufficientTravelTimeEventType:
      type: string
      enum:
        - Job
        - Activity
        - HomeVisit
    InsufficientTravelTimeHomeVisit:
      required:
        - details
        - type
      type: object
      description: The home visit
      allOf:
        - $ref: '#/components/schemas/InsufficientTravelTimeEvent'
        - type: object
          properties:
            details:
              $ref: '#/components/schemas/InsufficientTravelTimeHomeVisitDetails'
    InsufficientTravelTimeHomeVisitDetails:
      required:
        - end
        - start
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      description: The details of the home visit.
    InsufficientTravelTimeJob:
      required:
        - name
        - uid
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        description:
          type: string
    InsufficientTravelTimeJobAllocation:
      required:
        - details
        - type
      type: object
      description: The job allocation
      allOf:
        - $ref: '#/components/schemas/InsufficientTravelTimeEvent'
        - type: object
          properties:
            details:
              $ref: '#/components/schemas/InsufficientTravelTimeJobAllocationDetails'
    InsufficientTravelTimeJobAllocationDetails:
      required:
        - job
        - uid
      type: object
      properties:
        uid:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        job:
