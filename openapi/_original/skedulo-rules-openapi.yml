          type: integer
          description: The ID of the Rule Violation to assign to the user
          example: 2756
        user:
          type: string
          description: The user to assign to the Rule Violation
          example: a521ed9f-a353-4952-b6cd-e7b5e02c3591
      description: Details of the Rule Violation user assignment.
    RuleViolationContext:
      required:
        - _type
      type: object
      properties:
        _type:
          type: string
      description: A JSON object containing extra information for the violation
      discriminator:
        propertyName: _type
        mapping:
          custom: '#/components/schemas/CustomContext'
          insufficientTravelTime: '#/components/schemas/InsufficientTravelTimeContext'
          jobDependencies: '#/components/schemas/JobDependenciesContext'
          jobOverallocated: '#/components/schemas/JobOverallocatedContext'
          jobTimeConstraints: '#/components/schemas/JobTimeConstraintsContext'
          missingJobTags: '#/components/schemas/MissingJobTagsContext'
          missingOptionalJobTags: '#/components/schemas/MissingJobTagsContext'
          resourceAccountExcluded: '#/components/schemas/ResourceAccountExcludedContext'
          resourceAccountNotIncluded: '#/components/schemas/ResourceAccountNotIncludedContext'
          resourceInactive: '#/components/schemas/ResourceInactiveContext'
          resourceLocationExcluded: '#/components/schemas/ResourceLocationExcludedContext'
          resourceLocationNotIncluded: '#/components/schemas/ResourceLocationNotIncludedContext'
          resourceUnavailable: '#/components/schemas/ResourceUnavailableContext'
          workOverlap: '#/components/schemas/WorkOverlapContext'
    RuleViolationInput:
      required:
        - link
        - regionId
        - resourceIds
        - ruleId
        - sourceId
        - sourceType
        - targetId
        - targetType
      type: object
      properties:
        ruleId:
          maxLength: 255
          minLength: 1
          type: string
          description: >-
            The type of rule that was violated. Custom violations must have any
            non-empty rule ID.
          example: unsafeArea
        targetId:
          maxLength: 255
          minLength: 1
          type: string
          description: >-
            The UID of the object that the rule violation affects. Target IDs
            should be unique across all object types.
          example: b055d7c1-ef2f-40e9-bcd2-634e9835e69b
        sourceId:
          maxLength: 255
          minLength: 1
          type: string
          description: >-
            The UID of the object that caused rule violation (may be the same as
            the target). Source IDs should be unique across all object types.
          example: 5c832cd6-006b-454a-b747-5cb62beef885
        targetType:
          maxLength: 255
          minLength: 1
          type: string
          description: >-
            The object type of the target object. This must be a standard or
            custom data model object type in singular camelCase.
          example: job
        sourceType:
          maxLength: 255
          minLength: 1
          type: string
          description: >-
            The object type of the source object. This must be a standard or
            custom data model object type in singular camelCase.
          example: job
        startTime:
          type: string
          description: >-
            The time at which the violation starts. This is used for filtering
            by time window.
          format: date-time
        endTime:
          type: string
          description: >-
            The time at which the violation ends. This is used for filtering by
            time window.
          format: date-time
        regionId:
          maxLength: 255
          minLength: 1
          type: string
          description: The region of the target object. Used for filtering results.
          example: 6cdd3be8-6fab-44c5-a6b7-e9ddc6860eb7
        resourceIds:
          maxItems: 100
          minItems: 0
          uniqueItems: true
          type: array
          description: >-
            The resources that the violation applies to, if any. Used for
            filtering results.
          items:
            maxLength: 255
            minLength: 1
            type: string
            example: d5ed41db-87ee-4dd2-a65c-dd37dc253d3b
        description:
          maxLength: 1024
          minLength: 1
          type: string
          description: >-
            A user-friendly description of the rule violation, to be displayed
            by the UI.
          example: Job is in an area that may be unsafe
        link:
          $ref: '#/components/schemas/RuleViolationLink'
        context:
          type: object
      description: >-
        Details of the custom Rule Violation. The ruleId, targetId and sourceId
        form a unique key.
    RuleViolationLink:
      required:
        - name
        - type
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RuleViolationLinkType'
        name:
          maxLength: 255
          minLength: 1
          type: string
          description: The name of the link.
          example: Job
      description: Link details to the target of the violation.
      discriminator:
        propertyName: type
        mapping:
          skedulo: '#/components/schemas/SkeduloRuleViolationLink'
          external: '#/components/schemas/ExternalRuleViolationLink'
    RuleViolationLinkType:
      type: string
      enum:
        - skedulo
        - external
    RuleViolationListResult:
      required:
        - limitReached
        - violations
      type: object
      properties:
        violations:
          type: array
          description: List of violations.
          items:
            $ref: '#/components/schemas/RuleViolationResult'
        limitReached:
          type: boolean
          description: >-
            True if the maximum number of violations retrievable in a single
            query has been reached (currently 2000 violations).
      description: Results of a find Rule Violations by list of target object UIDs query.
    RuleViolationResult:
      required:
        - context
        - createdTime
        - id
        - isCustom
        - lastModifiedTime
        - regionId
        - resourceIds
        - ruleId
        - sourceId
        - sourceType
        - status
        - targetId
        - targetType
      type: object
      properties:
        id:
          type: integer
          description: Globally unique identifier for the violation.
          example: 123
        ruleId:
          type: string
          description: >-
            The type of rule that was violated. Core rule ids
            are:<br><ul><li>insufficientTravelTime</li><li>jobDependencies</li><li>jobOverallocated</li><li>jobTimeConstraints</li><li>missingJobTags</li><li>missingOptionalJobTags</li><li>resourceAccountExcluded</li><li>resourceAccountNotIncluded</li><li>resourceInactive</li><li>resourceLocationExcluded</li><li>resourceLocationNotIncluded</li><li>resourceUnavailable</li><li>workOverlap</li></ul>
          example: workOverlap
        isCustom:
          type: boolean
          description: True if the violation was inserted by an external client.
          example: false
        targetId:
          type: string
          description: The UID of the object that the rule violation affects.
          example: b055d7c1-ef2f-40e9-bcd2-634e9835e69b
        sourceId:
          type: string
          description: >-
            The UID of the object that caused rule violation (may be the same as
            the target).
          example: 5c832cd6-006b-454a-b747-5cb62beef885
        targetType:
          type: string
          description: The object type of the target object.
          example: job
        sourceType:
          type: string
          description: The object type of the source object.
          example: job
        startTime:
          type: string
          description: The time at which the violation starts.
          format: date-time
          example: '2022-01-01T09:00:00Z'
        endTime:
          type: string
          description: The time at which the violation ends.
          format: date-time
          example: '2022-01-01T10:00:00Z'
        regionId:
          type: string
          description: The region of the target object. Used for filtering results.
          example: 6cdd3be8-6fab-44c5-a6b7-e9ddc6860eb7
        resourceIds:
          uniqueItems: true
          type: array
          description: The resources that the violation applies to, if any.
          items:
            type: string
            example: d5ed41db-87ee-4dd2-a65c-dd37dc253d3b
        description:
          type: string
          description: A user-friendly description of the rule violation.
          example: Job is in an area that may be unsafe
        link:
          $ref: '#/components/schemas/RuleViolationLink'
        status:
          type: string
          description: The current status assigned to the violation
          example: In Progress
        assignedTo:
          type: string
          description: The user assigned to the violation
          example: a521ed9f-a353-4952-b6cd-e7b5e02c3591
        context:
          $ref: '#/components/schemas/RuleViolationContext'
        createdTime:
          type: string
          description: Created timestamp
          format: date-time
        lastModifiedTime:
          type: string
          description: Last modified timestamp
          format: date-time
      description: >-
        Details of a Rule Violation that was either generated by the core engine
        or inserted by a client.
    RuleViolationSearchFilterInput:
      required:
        - startTime
      type: object
      properties:
        startTime:
          type: string
          description: Start of the search time window.
          format: date-time
        endTime:
          type: string
          description: >-
            End of the search time window. If not specified, it defaults to
            startTime + 365 days.
          format: date-time
        targetTypes:
          maxItems: 200
          minItems: 0
          type: array
          description: >-
            If provided, only violations having these targetType values are
            included.
          items:
            type: string
            example: job
        regionIds:
          maxItems: 200
          minItems: 0
          type: array
          description: If provided, only violations from these regions are included.
          items:
            type: string
            example: 6cdd3be8-6fab-44c5-a6b7-e9ddc6860eb7
        resourceIds:
          maxItems: 200
          minItems: 0
          type: array
          description: If provided, only violations for these resources are included.
          items:
            type: string
            example: d5ed41db-87ee-4dd2-a65c-dd37dc253d3b
        statuses:
          maxItems: 100
          minItems: 0
          type: array
          description: If provided, only violations for these statuses are included.
          items:
            type: string
            example: In Progress
        ruleIds:
          $ref: '#/components/schemas/RuleIdSearchFilter'
        assignedTo:
          $ref: '#/components/schemas/AssignedToFilter'
        includeNoTimestamp:
          type: boolean
          description: If true, violations with no startTime and endTime are included.
          example: false
        targetIds:
          maxItems: 200
          minItems: 0
          type: array
          description: If provided, only violations for these targetIds are included.
          items:
            type: string
            example: d5ed41db-87ee-4dd2-a65c-dd37dc253d3b
      description: >-
        Search Rule Violations filter criteria.


        For the time range filter, Rule Violations whose [startTime, endTime]
        interval overlaps with the provided search time range are returned. Time
        ranges are treated as half-open intervals, meaning that violations that
        start at the end time of the range will not be returned.
    RuleViolationSearchInput:
      required:
        - filter
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/RuleViolationSearchFilterInput'
        limit:
          maximum: 2000
          minimum: 1
          type: integer
          description: >-
            Pagination limit (number of violations per page). If not specified,
            a default limit of 200 is used.
          format: int32
          example: 200
        offset:
          maximum: 9223372036854776000
          minimum: 0
          type: integer
          description: Pagination offset (zero-based). Defaults to 0.
          format: int64
          example: 100
        sortBy:
          type: array
          description: >-
            List of Rule Violation fields the results should be ordered by. Any
            results that are equal after ordering will be ordered by 'id ASC'.


            If not provided, the default ordering is 'startTime ASC' followed by
            'id ASC'.
          items:
            $ref: '#/components/schemas/Order'
      description: Parameters of a search Rule Violations query.
    RuleViolationSearchResult:
      required:
        - hasNextPage
        - totalCount
        - violations
      type: object
      properties:
        violations:
          type: array
          description: List of violations for the current page.
          items:
            $ref: '#/components/schemas/RuleViolationResult'
        totalCount:
          type: integer
          description: Total number of violations.
          format: int64
          example: 440
        hasNextPage:
          type: boolean
          description: True if there are more results after the current page.
          example: true
        nextOffset:
          type: integer
          description: Start offset of the next page (null if hasNextPage is false).
          format: int64
          example: 300
      description: Results of a search Rule Violations query.
    RuleViolationTargetIdsInput:
      required:
        - targetIds
      type: object
      properties:
        targetIds:
          maxItems: 1000
          minItems: 0
          type: array
          description: >-
            List of the UIDs of the objects that the rule violation affects.
            Target IDs should be unique across all object types.
          items:
            type: string
            example: b055d7c1-ef2f-40e9-bcd2-634e9835e69b
      description: A list of target object UIDs.
    RuleViolationsInput:
      required:
        - violations
      type: object
      properties:
        violations:
          maxItems: 100
          minItems: 0
          type: array
          description: The type of rule that was violated.
          example: unsafeArea
          items:
            $ref: '#/components/schemas/RuleViolationInput'
      description: A list of violations.
    SkeduloRuleViolationLink:
      required:
        - name
        - type
      type: object
      allOf:
        - $ref: '#/components/schemas/RuleViolationLink'
        - type: object
          properties:
            name:
              type: string
    Tag:
      required:
        - name
      type: object
      properties:
        name:
          type: string
    TimeConstraintViolation:
      required:
        - constraintRule
      type: object
      properties:
        constraintRule:
          $ref: '#/components/schemas/JobTimeConstraintsRule'
      description: Details of a job time constraint violation.
      discriminator:
        propertyName: constraintRule
        mapping:
          MustStartAfter: '#/components/schemas/TimeConstraintViolationWithTime'
          MustStartBefore: '#/components/schemas/TimeConstraintViolationWithTime'
          MustEndBefore: '#/components/schemas/TimeConstraintViolationWithTime'
          ShouldStartAfter: '#/components/schemas/TimeConstraintViolationWithTime'
          ShouldStartBefore: '#/components/schemas/TimeConstraintViolationWithTime'
          ShouldEndBefore: '#/components/schemas/TimeConstraintViolationWithTime'
          MustMatchAtLeastOne: '#/components/schemas/TimeConstraintViolationWithoutTime'
    TimeConstraintViolationWithTime:
      required:
        - constraintRule
        - constraintTime
      type: object
      description: Details of a job time constraint violation.
      allOf:
        - $ref: '#/components/schemas/TimeConstraintViolation'
        - type: object
          properties:
            constraintTime:
              type: string
              format: date-time
    TimeConstraintViolationWithoutTime:
      required:
        - constraintRule
      type: object
      description: >-
        Details of a job time constraint violation that does not apply to a
        specific time.
      allOf:
        - $ref: '#/components/schemas/TimeConstraintViolation'
    WorkOverlapActivity:
      required:
        - details
        - type
      type: object
      description: The overlapping activity
      allOf:
        - $ref: '#/components/schemas/WorkOverlapWorkAllocation'
        - type: object
          properties:
            details:
              $ref: '#/components/schemas/WorkOverlapActivityDetails'
    WorkOverlapActivityDetails:
      required:
        - end
        - name
        - start
        - uid
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        type:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      description: The details of the activity.
    WorkOverlapContext:
      required:
        - _type
        - resource
      type: object
      description: >-
        Details of the work overlap violation. Fields correspond to those in the
        Skedulo data model, unless stated otherwise.
      allOf:
        - $ref: '#/components/schemas/RuleViolationContext'
        - type: object
          properties:
            resource:
              $ref: '#/components/schemas/WorkOverlapResource'
    WorkOverlapJob:
      required:
        - name
        - uid
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        description:
          type: string
    WorkOverlapJobAllocation:
      required:
        - details
        - type
      type: object
      description: The overlapping job allocation
      allOf:
        - $ref: '#/components/schemas/WorkOverlapWorkAllocation'
        - type: object
          properties:
            details:
              $ref: '#/components/schemas/WorkOverlapJobAllocationDetails'
    WorkOverlapJobAllocationDetails:
      required:
        - job
        - uid
      type: object
      properties:
        uid:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        job:
          $ref: '#/components/schemas/WorkOverlapJob'
      description: The details of the job allocation.
    WorkOverlapResource:
      required:
        - name
        - uid
        - workAllocation1
        - workAllocation2
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        workAllocation1:
          $ref: '#/components/schemas/WorkOverlapWorkAllocation'
        workAllocation2:
          $ref: '#/components/schemas/WorkOverlapWorkAllocation'
    WorkOverlapWorkAllocation:
      required:
        - type
      type: object
      properties:
        type:
          $ref: '#/components/schemas/WorkOverlapWorkAllocationType'
      description: The overlapping work allocation.
      discriminator:
        propertyName: type
        mapping:
          Job: '#/components/schemas/WorkOverlapJobAllocation'
          Activity: '#/components/schemas/WorkOverlapActivity'
    WorkOverlapWorkAllocationType:
      type: string
      enum:
        - Job
        - Activity
  securitySchemes:
    ApiKeyAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
