      type: object
      required:
        - dispatch
        - reminder
        - cancelled
        - offer
        - timeChanged
      properties:
        dispatch:
          type: boolean
          description: >-
            If true then a notification is sent to the resource when they are
            dispatched via the dispatch endpoint.
          default: true
        reminder:
          type: boolean
          description: >-
            If true then a notification is sent to the resource if they are
            re-dispatched via the dispatch/notify endpoint.
          default: true
        cancelled:
          type: boolean
          description: >-
            If true then a notification is sent to the resource if the
            notify_cancel endpoint is called or if automatic resource job events
            are enabled and a job they are allocated to is cancelled.
          default: true
        offer:
          type: boolean
          description: If true then a notifications for job offers are sent to resources.
          default: true
        timeChanged:
          type: boolean
          description: >-
            If true then a notification is sent to the resource if the time of a
            job they are allocated to is changed.
          default: false
