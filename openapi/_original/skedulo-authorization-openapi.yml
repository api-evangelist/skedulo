    UserSummaryInput:
      required:
        - tenantIds
      type: object
      properties:
        tenantIds:
          maxItems: 100
          minItems: 1
          type: array
          description: Tenant IDs to filter by
          items:
            type: string
            description: Tenant IDs to filter by
      description: Parameters to retrieve user summary.
    UserTypeMigrationInput:
      required:
        - dryRun
        - skipUserIds
        - tenantId
      type: object
      properties:
        tenantId:
          type: string
        dryRun:
          type: boolean
        skipUserIds:
          uniqueItems: true
          type: array
          items:
            type: string
    UserTypeMigrationResult:
      required:
        - before
        - status
        - tenantId
      type: object
      properties:
        tenantId:
          type: string
        status:
          type: string
          enum:
            - REQUIRES_MIGRATION
            - MIGRATION_COMPLETE
            - MIGRATION_FAILED
        before:
          $ref: '#/components/schemas/UserTypeMigrationStatusResult'
        after:
          $ref: '#/components/schemas/UserTypeMigrationStatusResult'
    UserTypeMigrationStatusResult:
      required:
        - activeUserTypes
        - migratedRoles
        - migratedUsers
        - rolesToMigrate
        - status
        - tenantId
        - usersToMigrate
      type: object
      properties:
        tenantId:
          type: string
        activeUserTypes:
          type: array
          items:
            type: string
        migratedRoles:
          type: array
          items:
            $ref: '#/components/schemas/CustomRole'
        rolesToMigrate:
          type: array
          items:
            $ref: '#/components/schemas/CustomRole'
        migratedUsers:
          type: array
          items:
            $ref: '#/components/schemas/User'
        usersToMigrate:
          type: array
          items:
            $ref: '#/components/schemas/User'
        status:
          type: string
          enum:
            - REQUIRES_MIGRATION
            - MIGRATION_COMPLETE
            - MIGRATION_FAILED
    VerifyUserInput:
      required:
        - authProviderId
        - email
      type: object
      properties:
        email:
          type: string
        authProviderId:
          type: string
