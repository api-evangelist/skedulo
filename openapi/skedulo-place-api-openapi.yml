openapi: 3.2.0
info:
  title: Geoservices Place API
  version: 1.0.0
servers:
- url: https://api.skedulo.com/geoservices
- url: https://api.uk.skedulo.com/geoservices
- url: https://api.ca.skedulo.com/geoservices
- url: https://api.au.skedulo.com/geoservices
tags:
- name: Place
paths:
  /place:
    post:
      security:
      - Authorization: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceDetailRequest'
        required: true
      summary: Fetch Place Detail
      description: For a given place Id, return the detailed information for that place.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceDetailResponse'
        '400':
          description: invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Place
      operationId: postPlace
      x-operation-id-source: derived
components:
  schemas:
    AddressComponents:
      type: object
      properties:
        streetNumber:
          type: string
        route:
          type: string
        locality:
          type: string
        area2:
          type: string
        area1:
          type: string
        country:
          type: string
        postalCode:
          type: string
    Error:
      type: object
      required:
      - errorType
      - message
      properties:
        errorType:
          type: string
        message:
          type: string
    LatLng:
      type: object
      required:
      - lat
      - lng
      properties:
        lat:
          description: -90 <= y <= 90
          type: number
        lng:
          description: -180 <= x <= 180
          type: number
    PlaceDetailResponse:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/PlaceDetail'
    PlaceDetailRequest:
      type: object
      required:
      - placeId
      - sessionId
      properties:
        placeId:
          type: string
          description: Unique id for a place in Google system, obtained from autocomplete endpoint.
        sessionId:
          type: string
          format: uuid
          description: A caller-generated uuid that may have been used in an autocomplete session.
    PlaceDetail:
      type: object
      required:
      - addressComponents
      - formattedAddress
      - geometry
      properties:
        addressComponents:
          $ref: '#/components/schemas/AddressComponents'
        formattedAddress:
          type: string
        geometry:
          $ref: '#/components/schemas/LatLng'
  securitySchemes:
    Authorization:
      type: apiKey
      in: header
      name: Authorization
