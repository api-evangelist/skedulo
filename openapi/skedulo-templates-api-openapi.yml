openapi: 3.2.0
info:
  title: Configurations Templates API
  version: 1.0.0
  description: Skedulo Configurations API
servers:
- url: https://api.skedulo.com/config
- url: https://api.uk.skedulo.com/config
- url: https://api.ca.skedulo.com/config
- url: https://api.au.skedulo.com/config
tags:
- name: Templates
paths:
  /templates/{schemaName}:
    get:
      security:
      - Authorization: []
      summary: Fetch schema templates
      description: Fetch all templates for a given schema.
      operationId: getTemplates
      parameters:
      - name: schemaName
        in: path
        description: Schema to retrieve templates for.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOKTemplates'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Templates
components:
  schemas:
    Error:
      type: object
      required:
      - errorType
      - message
      properties:
        errorType:
          type: string
        message:
          type: string
        errorId:
          type: string
    ResultOKTemplates:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/Template'
    TemplateId:
      type: string
      format: uuid
    Template:
      type: object
      required:
      - id
      - name
      - schemaName
      properties:
        id:
          $ref: '#/components/schemas/TemplateId'
        name:
          type: string
        schemaName:
          type: string
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
