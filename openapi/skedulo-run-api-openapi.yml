        totalScheduledJobs:
          type: integer
          format: int32
        requestedJobs:
          type: integer
          format: int32
        requestedJobsScheduled:
          type: integer
          format: int32
    PeriodConstraintsShape1:
      required:
      - start
      - end
      type: object
      properties:
        start:
          type: string
          description: Start of the constraint period; must be within the scheduling period
          format: date-time
        end:
          type: string
          description: End of the constraint period; must be within the scheduling period
          format: date-time
        maxServiceTimeInMinutes:
          type: integer
          description: Maximum total service (working) time for this resource within this period, in minutes
          format: int64
        minServiceTimeInMinutes:
          type: integer
          description: Minimum total service (working) time for this resource within this period, in minutes
          format: int64
        groupConstraints:
          type: array
          items:
            $ref: '#/components/schemas/GroupConstraintsShape'
          description: Defines the maximum number of allocations from specific groups that can be assigned to a resource during this period. Any group not listed has no limit.
    ExhaustedAvailabilityPeriod:
      required:
      - type
      - resourceId
      - start
      - end
      - gaps
      - allocationDurationFeasibleGaps
      - gapsExceedingMaximumTravelTime
      type: object
      properties:
        type:
          type: string
          description: '`exhausted_availability_period`'
          enum:
          - exhausted_availability_period
        resourceId:
          type: string
          description: The resource whose availability is exhausted in the given period
        start:
          type: string
          description: Start of the period in which the resource has no remaining availability
          format: date-time
        end:
          type: string
          description: End of the period in which the resource has no remaining availability
          format: date-time
        gaps:
          type: integer
          description: Total number of free gaps in this period that were evaluated
          format: int32
        allocationDurationFeasibleGaps:
          type: integer
          description: Number of gaps large enough to fit the allocation duration
          format: int32
        gapsExceedingMaximumTravelTime:
          type: integer
          description: Number of gaps where travel time to or from the gap exceeds the maximum allowed
          format: int32
        maxExcessiveTravelOrWaitTimeSeconds:
          type: integer
          description: Maximum excess travel or wait time in seconds across all evaluated gaps
          format: int64
        minExcessiveTravelOrWaitTimeSeconds:
          type: integer
          description: Minimum excess travel or wait time in seconds across all evaluated gaps
          format: int64
      description: The resource has no remaining free time in the given period that could accommodate this allocation, taking into account travel time, padding, snapping and the allocation duration.
    ResourceShape:
      required:
      - id
      - availability
      - attributes
      - periodConstraints
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this resource
        locationId:
          type: string
          description: The home location of this resource, used as the starting point for travel time calculations
        availability:
          type: array
          items:
            $ref: '#/components/schemas/ResourceAvailabilityShape'
          description: Time windows during which this resource is available for shift assignment, with an optional departure location for each window
        efficiency:
          type: integer
          description: Work efficiency of this resource (1-100); lower values indicate the resource takes proportionally longer to complete tasks relative to others
          format: int32
        statuteId:
          type: string
          description: Reference to a statute defining contractual working constraints (rest periods, min/max working hours) applicable to this resource
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeShape'
          description: Skills and qualifications held by this resource
        periodConstraints:
          type: array
          items:
            $ref: '#/components/schemas/PeriodConstraintsShape'
          description: Working time constraints applied to specific sub-periods of the scheduling window for this resource
    List_StringifiedRunError:
      oneOf:
      - $ref: '#/components/schemas/Nil'
      - type: array
        items:
          $ref: '#/components/schemas/StringifiedRunError'
    ObjectiveWeightsShape:
      type: object
      properties:
        minimizeDisruption:
          type: integer
        balanceAbsoluteWorkload:
          type: integer
        travelTime:
          type: integer
        minimizeResources:
          type: integer
        softSkills:
          type: integer
        jobsPriority:
          type: integer
        resourceRating:
          type: integer
        scheduleImmediacy:
          type: integer
        urgency:
          type: integer
        overtime:
          type: integer
    PhaseConfigurationShape:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: all = every object is active in this phase; filtered = apply object type filters
          enum:
          - all
          - filtered
        filters:
          type: array
          items:
            $ref: '#/components/schemas/PhaseObjectFilterShape'
          description: Filters controlling which objects are active in this phase; only present when type is filtered
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
