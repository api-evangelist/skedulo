          type: array
          items:
            $ref: '#/components/schemas/ResourceAvailabilityShape1'
          description: Time windows during which this resource is available for allocation, with optional start and end locations for each window
        compatibleResources:
          type: array
          items:
            type: string
          description: List of resource IDs that this resource is compatible with; used to constrain which resources can share work within a locked group
        maxDailyTravelTimeInMinutes:
          type: integer
          description: Maximum total travel time allowed per day for this resource, in minutes; overrides the global option if set
          format: int64
        maxTravelTimeBetweenLocations:
          type: integer
          description: Maximum travel time allowed between any two consecutive allocation locations for this resource, in minutes; overrides the global option if set
          format: int64
        periodConstraints:
          type: array
          items:
            $ref: '#/components/schemas/PeriodConstraintsShape1'
          description: Allows a resource to be given minimum and maximum service times for different periods
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/BreakShape'
          description: Scheduled breaks that must be incorporated into the resource's route
        rating:
          type: integer
          description: The rating of the resource, can be an integer between 1 and 100
          format: int32
        phaseTags:
          type: array
          items:
            type: string
          description: Phase tags that restrict this resource to specific phases. If absent or empty, the resource is included in all phases.
    InfeasibilityReasonShape:
      oneOf:
      - $ref: '#/components/schemas/AllocationLocked'
      - $ref: '#/components/schemas/ExhaustedAvailabilityPeriod'
      - $ref: '#/components/schemas/ExhaustedPeriodGroupConstraint'
      - $ref: '#/components/schemas/ExhaustedPeriodServiceTime'
      - $ref: '#/components/schemas/GroupCannotBeFullyAllocated'
      - $ref: '#/components/schemas/GroupLocked'
      - $ref: '#/components/schemas/RequiredAttributes'
      - $ref: '#/components/schemas/RequiredAttributesPeriod'
      - $ref: '#/components/schemas/ResourceNoAvailabilityOverlap'
      - $ref: '#/components/schemas/ResourceNoAvailabilityOverlapPeriod'
      - $ref: '#/components/schemas/ResourceRestricted1'
      - $ref: '#/components/schemas/TimeConstraintAfterPeriod1'
      - $ref: '#/components/schemas/TimeConstraintBeforePeriod1'
      - $ref: '#/components/schemas/TimeConstraintNoOverlap1'
    FeatureModelShape:
      oneOf:
      - $ref: '#/components/schemas/ARCShiftModelShape'
      - $ref: '#/components/schemas/CorePVRPFeatureModelShape'
    AllocationAttributeShape:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: The attribute identifier
        weighting:
          type: integer
          description: If present, this is a soft (preferred) requirement with the given weighting; if absent, this is a hard (required) attribute
          format: int32
    AllocationShape1:
      required:
      - id
      - groupIds
      - duration
      - locked
      - attributeRequirements
      - scheduleConstraints
      - resourceRatings
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this allocation
        groupId:
          type: string
          description: The allocation group if an allocation belongs to a single group
        groupIds:
          type: array
          items:
            type: string
          description: The allocation groups if an allocation belongs to multiple groups
        start:
          type: string
          description: The currently scheduled start time, if the allocation has already been scheduled
          format: date-time
        resourceId:
          type: string
          description: The resource currently assigned to this allocation, if any
        locationId:
          type: string
          description: The location at which this allocation takes place
        duration:
          type: integer
          description: The duration of the allocation in minutes
          format: int64
        locked:
          type: boolean
          description: If the allocation is locked, the start time and resourceId cannot be reassigned
        attributeRequirements:
          type: array
          items:
            $ref: '#/components/schemas/AllocationAttributeShape'
          description: Attributes a resource must or preferably should have to be assigned to this allocation
        resourceConstraints:
          $ref: '#/components/schemas/AllocationResourceConstraintShape'
        scheduleConstraints:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleTimeConstraintShape'
          description: Time windows within which this allocation must be scheduled; the allocation's start time must fall within one of these windows
        resourceRatings:
          type: array
          items:
            $ref: '#/components/schemas/AllocationResourceRatingShape'
          description: The rating of resources for this specific job. If present this will override the rating field on resources for this job.
        priority:
          type: integer
          description: Priority of this allocation (1-100); higher values cause the optimizer to prefer assigning this allocation over lower-priority ones
          format: int32
        urgency:
          type: integer
          description: Urgency of this allocation (1-100); higher values cause the optimizer to schedule the allocation closer to the start of its time windows
          format: int32
        phaseTags:
          type: array
          items:
            type: string
          description: Phase tags that restrict this allocation to specific phases. If absent or empty, the allocation is included in all phases.
    FeatureModelResultsShape:
      oneOf:
      - $ref: '#/components/schemas/ARCShiftFeatureModelResultsShape'
      - $ref: '#/components/schemas/CorePVRPFeatureModelResultsShape'
    ARCShiftUnscheduledAllocationShape:
      type: object
      properties:
        previousResourceId:
          type: string
          description: The resource that was previously assigned to this allocation before the optimization run, if any
    ResourceAvailabilityAttributeShape:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: The attribute identifier active during this availability window
    CorePVRPUnscheduledAllocationShape:
      required:
      - reasons
      - feasibleGaps
      type: object
      properties:
        previousStart:
          type: string
          description: The start time this allocation had before the optimization run, if it was previously scheduled
          format: date-time
        previousResourceId:
          type: string
          description: The resource this allocation was previously assigned to before the optimization run, if any
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/InfeasibilityReasonShape'
          description: The reasons why this allocation could not be scheduled
        feasibleGaps:
          $ref: '#/components/schemas/Map_List_FeasibleGapShape'
    FixedTimeBreakShape:
      required:
      - startTime
      - endTime
      type: object
      properties:
        startTime:
          type: string
          description: The fixed start time of the break
          format: date-time
        endTime:
          type: string
          description: The fixed end time of the break
          format: date-time
        locationId:
          type: string
          description: Optional location where the resource will be during this break; affects travel time calculations for surrounding allocations
    TimeConstraintAfterPeriod1:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: '`time_constraint_after_period`'
          enum:
          - time_constraint_after_period
      description: All of the allocation's schedule time constraints fall entirely after the scheduling period.
    PeriodConstraintsShape:
      required:
      - start
      - end
      type: object
      properties:
        start:
          type: string
          description: Start of the constraint period; must be within the scheduling period
          format: date-time
        end:
          type: string
          description: End of the constraint period; must be within the scheduling period
          format: date-time
        minRestTimeInMinutes:
          type: integer
          description: Minimum rest time required between consecutive allocations within this period, in minutes
          format: int64
        minWorkingDays:
          type: integer
          description: Minimum number of days the resource must work within this period
          format: int32
        maxWorkingDays:
          type: integer
          description: Maximum number of days the resource may work within this period
          format: int32
        minWorkingDurationInMinutes:
          type: integer
          description: Minimum total working duration within this period, in minutes
          format: int64
        maxWorkingDurationInMinutes:
          type: integer
          description: Maximum total working duration within this period, in minutes
          format: int64
    Map_CorePVRPScheduledAllocationShape:
      type: object
      description: Allocations that were successfully scheduled, keyed by allocation ID
      additionalProperties:
        $ref: '#/components/schemas/CorePVRPScheduledAllocationShape'
    DiffScheduleShape:
      type: object
      properties:
        deallocation:
          type: string
        allocation:
          type: string
        initialScheduleTime:
          type: string
          format: date-time
        scheduleTime:
          type: string
          format: date-time
    CorePVRPFeatureModelShape:
      required:
      - allocations
      - groups
      - resources
      - allocationDependencies
      - resourceDependencies
      - locations
      - schedulingPeriod
      - rollingSchedulingPeriods
      - timezone
      - options
      - solver
      - sharedGroupConstraints
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationShape1'
          description: Allocations to be optimized, each to one resource
        groups:
          type: array
          items:
            $ref: '#/components/schemas/AllocationGroupShape'
          description: Groups of allocations that should be synchronized by time
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceShape1'
          description: Resources that can be allocated to
        allocationDependencies:
          type: array
          items:
            $ref: '#/components/schemas/AllocationDependencyShape'
          description: Contains pairs of allocations which must be scheduled within a certain time of each other
        resourceDependencies:
          type: array
          items:
            $ref: '#/components/schemas/ResourceDependencyShape'
          description: Contains sets of allocations which must be allocated to the same resource
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationShape2'
          description: All the locations included in the model for both allocations and resources
        schedulingPeriod:
          $ref: '#/components/schemas/ScheduleRunWindow'
        rollingSchedulingPeriods:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRunWindow'
          description: Optional sub-windows used for rolling schedule optimization; the scheduling period is split into these periods and each is solved sequentially
        timezone:
          type: string
          description: The timezone used for date-based period constraint calculations
        options:
          $ref: '#/components/schemas/PVRPFeatureOptionsShape'
        meta:
          type: object
          description: 'Additional metadata for the model. For route optimization the default shape is ProductMeta, which contains: ''allocations'' — a map from CorePVRP allocation ID to either a Job reference (jobId, optional initial resource/allocation IDs, optional resourceRequirementId) or an Activity reference (activityId); ''frozenJobs'' — a map from job ID to the reasons it was excluded from optimization (e.g. has dependencies outside scope, outside region, not in requested jobs); ''activityBreaks'' — a map from activity ID to the resource and fixed-time break period for activities that represent resource breaks.'
          additionalProperties:
            description: Any JSON value (string, number, boolean, null, object, or array)
        solver:
          type: string
          description: Identifies the solver type; always 'pvrp' for CorePVRP models
          enum:
          - pvrp
        phases:
          type: array
          items:
            $ref: '#/components/schemas/PhaseConfigurationShape'
          description: Optional ordered list of phases for strict prioritization. Each phase is either 'all' (every object is active) or 'filtered' (per-object-type tag filters control which objects are active). Phases are processed in order and allocations assigned during one phase are locked for subsequent phases.
        sharedGroupConstraints:
          type: array
          items:
            $ref: '#/components/schemas/SharedGroupConstraintShape'
          description: Collective allocation limits shared across a filtered set of resources. Unlike per-resource groupConstraints, each entry caps the total allocations of a group across all listed resources combined (a shared pool), regardless of how they are distributed. Every resource in the pool shares the exact same period and limit.
    Map_List_FeasibleGapShape:
      type: object
      description: 'Feasible gaps per resource: time windows where the resource was available and the allocation could fit, keyed by resource ID. Only resources with at least one feasible gap are included.'
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/FeasibleGapShape'
    ObjectiveWeightModifiersShape:
      type: object
      properties:
        minimizeDisruption:
          type: number
        balanceAbsoluteWorkload:
          type: number
        travelTime:
          type: number
        minimizeResources:
          type: number
        softSkills:
          type: number
        jobsPriority:
          type: number
        resourceRating:
          type: number
        scheduleImmediacy:
          type: number
        urgency:
          type: number
        overtime:
          type: number
    GroupLocked:
      required:
      - type
      - groupId
      type: object
      properties:
        type:
          type: string
          description: '`group_locked`'
          enum:
          - group_locked
        groupId:
          type: string
          description: The group that is locked, preventing any of its allocations from being reassigned
      description: The allocation's group is locked, preventing the entire group from being reassigned.
    PVRPFeatureOptionsShape:
      type: object
      properties:
        full:
          type: boolean
          description: If true, runs a full optimization pass; if false, only optimizes unscheduled allocations
        ignoreTravelTime:
          type: boolean
          description: If true, travel time between locations is not considered when scoring the solution
        ignoreTravelTimeFirstJob:
          type: boolean
          description: If true, travel time to a resource's first allocation of the day is not penalised
        ignoreTravelTimeLastJob:
          type: boolean
          description: If true, travel time from a resource's last allocation of the day is not penalised
        minimizeResources:
          type: boolean
          description: If true, the optimizer will attempt to use the minimum number of resources required to service all allocations
        maxDailyTravelTimeInMinutes:
          type: integer
          description: Global maximum total travel time per resource per day in minutes; can be overridden per resource
          format: int64
        maxTravelTimeBetweenLocations:
          type: integer
          description: Global maximum travel time between any two consecutive allocation locations in minutes; can be overridden per resource
          format: int64
        respectAllocationTimes:
          type: boolean
          description: If true, currently scheduled start times are treated as soft constraints that the optimizer will try to preserve
        respectAllocationTimesOverTimeConstraints:
          type: boolean
          description: If true, existing allocation start times take precedence over schedule time window constraints when the two conflict
        balanceAbsoluteWorkload:
          type: boolean
          description: If true, the optimizer will try to balance the total absolute working time evenly across all resources
        snapUnit:
          type: integer
          description: Snap allocation start times to multiples of this value in minutes; useful to avoid solutions with odd start times
          format: int32
        padding:
          type: integer
          description: Minimum gap in minutes that must be left between consecutive allocations for a resource, in addition to travel time
          format: int32
        objectiveWeights:
          $ref: '#/components/schemas/ObjectiveWeightsShape'
        objectiveWeightModifiers:
          $ref: '#/components/schemas/ObjectiveWeightModifiersShape'
        temporalAffinityStrength:
          type: integer
          description: Strength of the preference to schedule allocations close in time to their schedule time windows (1-100)
          format: int32
        enablePartiallyAllocatedGroups:
          type: boolean
          description: If true, allocation groups that cannot be fully assigned will be partially assigned rather than left unscheduled
        enablePartiallyAllocatedAllocationDependencies:
          type: boolean
          description: If true, allocation dependencies that cannot be fully assigned will be partially assigned rather than left unscheduled
    CorePVRPScheduledAllocationShape:
      required:
      - start
      - resourceId
      - infeasibilityReasons
      - feasibleGaps
      type: object
      properties:
        start:
          type: string
          description: The scheduled start time of this allocation
          format: date-time
        resourceId:
          type: string
          description: The resource assigned to this allocation
        infeasibilityReasons:
          type: array
          items:
            $ref: '#/components/schemas/InfeasibilityReasonShape'
          description: Infeasibility reasons recorded against this allocation even though it was scheduled; present when the allocation is scheduled but constraints prevent it from being reassigned to other resources
        feasibleGaps:
          $ref: '#/components/schemas/Map_List_FeasibleGapShape'
    Map_CorePVRPUnscheduledAllocationShape:
      type: object
      description: Allocations that could not be scheduled, keyed by allocation ID
      additionalProperties:
        $ref: '#/components/schemas/CorePVRPUnscheduledAllocationShape'
    RunSummary:
      required:
