  /run/{runId}/meta:
    get:
      summary: Get the metadata for a run
      description: Returns arbitrary key-value metadata associated with an optimization run. Returns null if no metadata has been recorded for the run.
      operationId: Get Run Meta
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    description: Arbitrary JSON object (key/value pairs)
                    additionalProperties:
                      description: Any JSON value (string, number, boolean, null, object, or array)
              example:
                result:
                  key: value
      security:
      - httpAuth: []
      tags:
      - Run
components:
  schemas:
    ResourceConstraintsShape:
      required:
      - type
      - resources
      type: object
      properties:
        type:
          type: string
          description: The constraint type; currently only 'blocked' (exclude list) is supported
          enum:
          - blocked
        resources:
          type: array
          items:
            type: string
          description: The resources to which this constraint applies
      description: Restricts which resources may be assigned to this allocation
    LocationShape2:
      required:
      - id
      - latitude
      - longitude
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this location
        latitude:
          type: number
          description: Geographic latitude coordinate
          format: double
        longitude:
          type: number
          description: Geographic longitude coordinate
          format: double
    FeasibleGapShape:
      required:
      - start
      - end
      type: object
      properties:
        start:
          type: string
          description: Start of the feasible gap interval
          format: date-time
        end:
          type: string
          description: End of the feasible gap interval
          format: date-time
        previousLocation:
          $ref: '#/components/schemas/LocationShape'
        nextLocation:
          $ref: '#/components/schemas/LocationShape'
    SharedGroupConstraintShape:
      required:
      - groupId
      - resourceIds
      - maxAllocations
      - start
      - end
      type: object
      properties:
        groupId:
          type: string
          description: The allocation group identifier the pooled limit applies to
        resourceIds:
          type: array
          items:
            type: string
          description: The resources that share the pooled limit
        maxAllocations:
          type: integer
          description: Maximum number of allocations from this group across all listed resources combined within the period
          format: int32
        start:
          type: string
          description: Start of the period the pooled limit applies to
          format: date-time
        end:
          type: string
          description: End of the period the pooled limit applies to
          format: date-time
    DiffAllocationShape:
      type: object
      properties:
        deallocation:
          type: string
        allocation:
          type: string
    ExhaustedPeriodServiceTime:
      required:
      - type
      - resourceId
      - start
      - end
      type: object
      properties:
        type:
          type: string
          description: '`exhausted_period_service_time`'
          enum:
          - exhausted_period_service_time
        resourceId:
          type: string
          description: The resource that has reached its maximum service time in the given period
        start:
          type: string
          description: Start of the period in which the resource has exhausted its maximum service time
          format: date-time
        end:
          type: string
          description: End of the period in which the resource has exhausted its maximum service time
          format: date-time
      description: The resource has reached its maximum allowed service (working) time within the given period, so assigning this allocation would exceed the period constraint.
    RequiredAttributesPeriod:
      required:
      - type
