          description: End of the availability window
          format: date-time
        fromLocation:
          type: string
          description: Location from which the resource departs at the start of this availability window; overrides the resource's home location for travel time calculations
    PeriodConstraintsShape1:
      required:
      - start
      - end
      type: object
      properties:
        start:
          type: string
          description: Start of the constraint period; must be within the scheduling period
          format: date-time
        end:
          type: string
          description: End of the constraint period; must be within the scheduling period
          format: date-time
        maxServiceTimeInMinutes:
          type: integer
          description: Maximum total service (working) time for this resource within this period, in minutes
          format: int64
        minServiceTimeInMinutes:
          type: integer
          description: Minimum total service (working) time for this resource within this period, in minutes
          format: int64
        groupConstraints:
          type: array
          items:
            $ref: '#/components/schemas/GroupConstraintsShape'
          description: Defines the maximum number of allocations from specific groups that can be assigned to a resource during this period. Any group not listed has no limit.
    GraphQLResource:
      required:
      - UID
      - ResourceTags
      - ResourceOverrides
      type: object
      properties:
        UID:
          type: string
        GeoLatitude:
          type: number
          format: double
        GeoLongitude:
          type: number
          format: double
        ResourceTags:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLResourceTag'
        HomeAddress:
          type: string
        WeeklyHours:
          type: number
        WorkingHoursTimePeriod:
          type: string
          enum:
          - Day
          - Week
          - TwoWeeks
          - FourWeeks
        WorkingHoursStart:
          type: string
          format: date
        WorkingHoursMin:
          type: number
        WorkingHoursMax:
          type: number
        ResourceOverrides:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLResourceOverride'
        Rating:
          type: integer
          format: int32
        PrimaryRegion:
          $ref: '#/components/schemas/GraphQLResourcePrimaryRegion'
    ResourceShape:
      required:
      - id
      - availability
      - attributes
      - periodConstraints
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this resource
        locationId:
          type: string
          description: The home location of this resource, used as the starting point for travel time calculations
        availability:
          type: array
          items:
            $ref: '#/components/schemas/ResourceAvailabilityShape'
          description: Time windows during which this resource is available for shift assignment, with an optional departure location for each window
        efficiency:
          type: integer
          description: Work efficiency of this resource (1-100); lower values indicate the resource takes proportionally longer to complete tasks relative to others
          format: int32
        statuteId:
          type: string
          description: Reference to a statute defining contractual working constraints (rest periods, min/max working hours) applicable to this resource
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeShape'
          description: Skills and qualifications held by this resource
        periodConstraints:
          type: array
          items:
            $ref: '#/components/schemas/PeriodConstraintsShape'
          description: Working time constraints applied to specific sub-periods of the scheduling window for this resource
    FeatureModelShape:
      oneOf:
      - $ref: '#/components/schemas/ARCShiftModelShape'
      - $ref: '#/components/schemas/CorePVRPFeatureModelShape'
    AllocationDependencyShape:
      required:
      - anchorAllocationId
      - dependentAllocationId
      type: object
      properties:
        anchorAllocationId:
          type: string
          description: The allocation that represents the fixed point in time that the dependent allocation must be scheduled relative to
        dependentAllocationId:
          type: string
          description: The allocation that must be scheduled relative to the anchor allocation
        minTimeIntervalInMinutes:
          type: integer
          description: The offset that defines the start of the valid window of time relative to the anchor, if blank the dependent allocation has no earliest start time constraint, can be negative to represent a time before the anchor allocation
          format: int64
        maxTimeIntervalInMinutes:
          type: integer
          description: The offset that defines the end of the valid window of time for the dependent allocation to start relative to the anchor, if blank the dependent allocation has no latest start time constraint, can be negative to represent a time before the anchor allocation
          format: int64
        enablePartialAllocation:
          type: boolean
          description: Allows allocations in the allocation dependency to be partially allocated if they cannot be fully allocated. This will be overridden by the global setting options.enablePartiallyAllocatedAllocationDependencies if the global setting is true.
    ObjectiveWeightsShape:
      type: object
      properties:
        minimizeDisruption:
          type: integer
        balanceAbsoluteWorkload:
          type: integer
        travelTime:
          type: integer
        minimizeResources:
          type: integer
        softSkills:
          type: integer
        jobsPriority:
          type: integer
        resourceRating:
          type: integer
        scheduleImmediacy:
          type: integer
        urgency:
          type: integer
        overtime:
          type: integer
    AllocationResourceConstraintShape:
      required:
      - type
      - resources
      type: object
      properties:
        type:
          type: string
          description: Whether the resources list is a blocked (excluded) or allowed (included) list
          enum:
          - blocked
          - allowed
        resources:
          type: array
          items:
            type: string
          description: The resources to which this constraint applies
      description: Restricts which resources may be assigned to this allocation (blocked or allowed list)
    AllocationShape1:
      required:
      - id
      - groupIds
      - duration
      - locked
      - attributeRequirements
      - scheduleConstraints
      - resourceRatings
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this allocation
        groupId:
          type: string
          description: The allocation group if an allocation belongs to a single group
        groupIds:
          type: array
          items:
            type: string
          description: The allocation groups if an allocation belongs to multiple groups
        start:
          type: string
          description: The currently scheduled start time, if the allocation has already been scheduled
          format: date-time
        resourceId:
          type: string
          description: The resource currently assigned to this allocation, if any
        locationId:
          type: string
          description: The location at which this allocation takes place
        duration:
          type: integer
          description: The duration of the allocation in minutes
          format: int64
        locked:
          type: boolean
          description: If the allocation is locked, the start time and resourceId cannot be reassigned
        attributeRequirements:
          type: array
          items:
            $ref: '#/components/schemas/AllocationAttributeShape'
          description: Attributes a resource must or preferably should have to be assigned to this allocation
        resourceConstraints:
          $ref: '#/components/schemas/AllocationResourceConstraintShape'
        scheduleConstraints:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleTimeConstraintShape'
          description: Time windows within which this allocation must be scheduled; the allocation's start time must fall within one of these windows
        resourceRatings:
          type: array
          items:
            $ref: '#/components/schemas/AllocationResourceRatingShape'
          description: The rating of resources for this specific job. If present this will override the rating field on resources for this job.
        priority:
          type: integer
          description: Priority of this allocation (1-100); higher values cause the optimizer to prefer assigning this allocation over lower-priority ones
          format: int32
        urgency:
          type: integer
          description: Urgency of this allocation (1-100); higher values cause the optimizer to schedule the allocation closer to the start of its time windows
          format: int32
        phaseTags:
          type: array
          items:
            type: string
          description: Phase tags that restrict this allocation to specific phases. If absent or empty, the allocation is included in all phases.
    AllocationAttributeShape:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: The attribute identifier
        weighting:
          type: integer
          description: If present, this is a soft (preferred) requirement with the given weighting; if absent, this is a hard (required) attribute
          format: int32
    APIProductData:
      required:
      - jobs
      - activities
      - resources
      - accountResourceScores
      - locationResourceScores
      - availability
      - start
      - end
      - timezone
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLJob'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLActivity'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLResource'
        accountResourceScores:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLAccountResourceScore'
        locationResourceScores:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLLocationResourceScore'
        availability:
          $ref: '#/components/schemas/Map_ResourceId_ResourceAvailability'
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        rollingScheduleWindows:
          type: array
          items:
            $ref: '#/components/schemas/RollingScheduleWindow'
        timezone:
          type: string
        region:
          $ref: '#/components/schemas/GraphQLRegion'
        regions:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLRegion'
      description: All the data retrieved from GraphQL to run the optimization
    PhaseConfigurationShape:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: all = every object is active in this phase; filtered = apply object type filters
          enum:
          - all
          - filtered
        filters:
          type: array
          items:
            $ref: '#/components/schemas/PhaseObjectFilterShape'
          description: Filters controlling which objects are active in this phase; only present when type is filtered
    GraphQLJobDependencyFrom:
      required:
      - ToJobId
      type: object
      properties:
        ToJobId:
          type: string
        FromAnchor:
          $ref: '#/components/schemas/JobDependencyAnchor'
        ToAnchor:
          $ref: '#/components/schemas/JobDependencyAnchor'
        ToAnchorMinOffsetMinutes:
          type: integer
          format: int32
        ToAnchorMaxOffsetMinutes:
          type: integer
          format: int32
    AllocationGroupShape:
      required:
      - id
      - locked
      type: object
      properties:
        id:
          type: string
        synchronizationMode:
          type: string
          description: The time that should be synchronised for each job in the group
          default: no_synchronization
          enum:
          - no_synchronization
          - start_time
          - end_time
          - day
        locked:
          type: boolean
          description: If the group is locked, all allocations in the group will be locked
        enablePartialAllocation:
          type: boolean
          description: Allows allocations in the group to be partially allocated if they cannot be fully allocated. This will be overridden by the global setting options.enablePartiallyAllocatedGroups if the global setting is true.
          default: false
        phaseTags:
          type: array
          items:
            type: string
          description: Phase tags that restrict this group to specific phases. If absent or empty, the group is included in all phases.
    ResourceAvailabilityAttributeShape:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: The attribute identifier active during this availability window
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
