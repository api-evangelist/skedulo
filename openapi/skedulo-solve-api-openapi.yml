  /solve/planned:
    post:
      summary: Start an optimization run for the provided plan
      description: This endpoint will start a one-off optimization run based on the provided plan. The plan can be generated using the GET /schedule/plan endpoint.
      operationId: Solve planned
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePlanShape'
            example:
              productData:
                jobs:
                - UID: job-1
                  Start: '2022-01-26T09:00:00Z'
                  Duration: 60
                  JobStatus: Ready
                  LocationId: loc-1
                  GeoLatitude: 53.4834
                  GeoLongitude: -2.2425
                  Quantity: 1
                  JobAllocations: []
                  JobTags: []
                  ResourceRequirements: []
                  JobTimeConstraints: []
                  JobDependenciesFrom: []
                  JobDependenciesTo: []
                  Locked: false
                  RegionId: region-1
                  Urgency: Normal
                activities:
                - UID: activity-1
                  Start: '2022-01-26T09:00:00Z'
                  End: '2022-01-26T10:00:00Z'
                  LocationId: loc-1
                  GeoLatitude: 53.4834
                  GeoLongitude: -2.2425
                  ResourceId: resource1
                  ActivityResources: []
                resources:
                - UID: resource1
                  GeoLatitude: 1
                  GeoLongitude: 1
                  ResourceTags: []
                  HomeAddress: test home address
                  WorkingHoursTimePeriod: Week
                  WorkingHoursStart: '2022-01-26'
                  WorkingHoursMin: 20
                  WorkingHoursMax: 40
                  ResourceOverrides: []
                  PrimaryRegion:
                    Timezone: UTC
                locationResourceScores:
                - LocationId: loc-1
                  ResourceId: resource1
                  Blacklisted: false
                accountResourceScores:
                - AccountId: account-1
                  ResourceId: resource1
                  Blacklisted: false
                availability:
                  2bd0af54-377e-4960-8d4b-ba5272070830:
                    available:
                    - start: '2022-01-26T23:00:00Z'
                      end: '2022-01-29T23:00:00Z'
                    regions:
                    - start: '2022-01-26T23:00:00Z'
                      end: '2022-01-29T23:00:00Z'
                      regionIds:
                      - region-1
                start: '2022-01-26T09:00:00Z'
                end: '2022-01-30T23:00:00Z'
                timeZone: UTC
                region:
                  UID: region-1
                  Timezone: UTC
                  GeoLatitude: 53.4834
                  GeoLongitude: -2.2425
              featureModel:
                allocations:
                - id: alloc-1
                  groupId: alloc-group-1
                  groupIds:
                  - alloc-group-1
                  start: '2022-01-26T09:00:00Z'
                  duration: 30
                  resourceId: res-1
                  locationId: loc-1
                  priority: 10
                  locked: true
                  attributeRequirements:
                  - id: attr-1
                  - id: attr-2
                    weighting: 10
                  resourceConstraints:
                    type: blocked
                    resources:
                    - res-2
                  scheduleConstraints:
                  - windowStart: '2022-01-26T10:00:00Z'
                    windowEnd: '2022-01-26T11:00:00Z'
                  resourceRatings:
                  - resourceId: res-1
                    rating: 75
                  urgency: 20
                groups:
                - id: gr-1
                  synchronizationMode: start_time
                  locked: true
                  enablePartialAllocation: false
                resources:
                - id: res-1
                  attributes:
                  - id: attr-1
                  locationId: loc-1
                  availability:
                  - from: '2022-01-26T09:00:00Z'
                    to: '2022-01-30T23:00:00Z'
                    attributes: []
                  maxDailyTravelTimeInMinutes: 180
                  maxTravelTimeBetweenLocations: 60
                  periodConstraints:
                  - start: '2022-01-26T09:00:00Z'
                    end: '2022-01-30T23:00:00Z'
                    maxServiceTimeInMinutes: 100
                    minServiceTimeInMinutes: 50
                    groupConstraints:
                    - groupId: group-1
