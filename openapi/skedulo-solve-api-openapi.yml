          description: The location at which this allocation takes place
        priority:
          type: integer
          description: Priority of this allocation (1-100); higher values cause the optimizer to prefer assigning this allocation over lower-priority ones
          format: int32
        attributeRequirements:
          type: array
          items:
            $ref: '#/components/schemas/AttributeRequirementsShape'
          description: Attributes a resource must or preferably should have to be assigned to this allocation
        resourceConstraints:
          $ref: '#/components/schemas/ResourceConstraintsShape'
        preferredResourceIds:
          type: array
          items:
            type: string
          description: Ordered list of preferred resources for this allocation; the optimizer will prefer resources appearing earlier in the list
    ResourceAvailabilityShape1:
      required:
