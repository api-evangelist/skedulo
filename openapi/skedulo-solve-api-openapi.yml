openapi: 3.0.0
info:
  title: Authentication Admin Solve API
  description: Skedulo Authentication API
  version: 1.0.0
servers:
- url: https://api.skedulo.com/auth
- url: https://api.uk.skedulo.com/auth
- url: https://api.ca.skedulo.com/auth
- url: https://api.au.skedulo.com/auth
tags:
- name: Solve
paths:
  /solve:
    post:
      summary: Start an optimization run for a model
      description: This starts a one-off optimization run to solve the model given as an input.
      operationId: Solve
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureModelShape'
            examples:
              PVRP:
                value:
                  allocations:
                  - id: alloc-1
                    groupId: alloc-group-1
                    groupIds:
                    - alloc-group-1
                    start: '2022-01-26T09:00:00Z'
                    duration: 30
                    resourceId: res-1
                    locationId: loc-1
                    priority: 10
                    locked: true
                    attributeRequirements:
                    - id: attr-1
                    - id: attr-2
                      weighting: 10
                    resourceConstraints:
                      type: blocked
                      resources:
                      - res-2
                    scheduleConstraints:
                    - windowStart: '2022-01-26T10:00:00Z'
                      windowEnd: '2022-01-26T11:00:00Z'
                    resourceRatings:
                    - resourceId: res-1
                      rating: 75
                    urgency: 20
                  groups:
                  - id: gr-1
                    synchronizationMode: start_time
                    locked: true
                    enablePartialAllocation: false
                  resources:
                  - id: res-1
                    attributes:
                    - id: attr-1
                    locationId: loc-1
                    availability:
                    - from: '2022-01-26T09:00:00Z'
                      to: '2022-01-30T23:00:00Z'
                      attributes: []
                    maxDailyTravelTimeInMinutes: 180
                    maxTravelTimeBetweenLocations: 60
                    periodConstraints:
                    - start: '2022-01-26T09:00:00Z'
                      end: '2022-01-30T23:00:00Z'
                      maxServiceTimeInMinutes: 100
                      minServiceTimeInMinutes: 50
                      groupConstraints:
                      - groupId: group-1
                        maxAllocations: 5
                    breaks:
                    - breakTimeInMinutes: 30
                      minStartTime: '2022-01-26T12:00:00Z'
                      maxStartTime: '2022-01-26T13:00:00Z'
                    - startTime: '2022-01-26T15:00:00Z'
                      endTime: '2022-01-26T15:30:00Z'
                      locationId: loc-1
                    rating: 80
                    compatibleResources:
                    - res-2
                  allocationDependencies: []
                  resourceDependencies: []
                  locations:
                  - id: loc-1
                    latitude: 51.5072
                    longitude: 0.1276
                  schedulingPeriod:
                    start: '2022-01-26T09:00:00Z'
                    end: '2022-01-30T23:00:00Z'
                  timezone: UTC
                  meta:
                    key: value
                  options:
                    full: false
                    ignoreTravelTime: false
                    ignoreTravelTimeFirstJob: false
                    ignoreTravelTimeLastJob: false
                    minimizeResources: false
                    respectAllocationTimes: false
                    respectAllocationTimesOverTimeConstraints: false
                    balanceAbsoluteWorkload: false
                    enablePartiallyAllocatedGroups: true
                    enablePartiallyAllocatedAllocationDependencies: true
                    removeLockedJobsFromShifts: true
                  sharedGroupConstraints:
                  - groupId: group-1
                    resourceIds:
                    - res-1
                    - res-2
                    maxAllocations: 10
                    start: '2022-01-26T09:00:00Z'
                    end: '2022-01-30T23:00:00Z'
                  solver: pvrp
              ARC:
                value:
                  options:
                    locations: true
                    exceptionFilter:
                      blacklist: true
                      resourceAvailability: true
                    solviceWeights:
                      maxHours: 10hard
                      minHours: 10medium
                      minHoursUnassigned: 10medium
                      availability: 10hard
                      locked: 10hard
                      minRest: 10hard
                      requirements: 10hard
                      skills: 10hard
                      distance: 10hard
                      distanceAL: 10hard
                      priority: 10hard
                      pref: 10hard
                      unassigned: 10hard
                      softSkills: 10hard
                      criticalSkills: 10hard
                      blacklist: 10hard
                      efficiency: 10hard
                      softSkillsLevel: 10hard
                      maxWorkingDays: 10hard
                      shiftStart: 10hard
                      latestShiftStart: 10hard
                      shiftEnd: 10hard
                      minShift: 10hard
                      maxShift: 10hard
                      dayOfWeek: 10hard
                      sameDay: 10hard
                      sameDayMinRest: 10hard
                      maxConsecutive: 10hard
                      concurrent: 10hard
                      costs: 10hard
                      wages: 10hard
                      working: 10hard
                      minWorkingDaysUnassigned: 10medium
                      fairness: 10soft
                  allocations:
                  - locked: false
                    attributeRequirements:
                    - id: attr-1
                    - id: attr-2
                      weighting: 10
                    resourceConstraints:
                      type: blocked
                      resources:
                      - res-2
                    preferredResourceIds:
                    - res-1
                    - res-3
                    id: alloc-1
                    start: '2022-01-26T23:00:00Z'
                    duration: 30
                    resourceId: res-1
                    locationId: loc-1
                    priority: 10
                  resources:
                  - id: res-1
                    statuteId: st-1
                    attributes:
                    - id: attr-1
                      validFor:
                      - from: '2022-01-26'
                        to: '2022-01-02'
                      weighting: 10
                    locationId: loc-1
                    availability:
                    - from: '2022-01-26T09:00:00Z'
                      to: '2022-01-30T23:00:00Z'
                      fromLocation: loc-1
                    efficiency: 10
                    periodConstraints: []
                  statutes:
                  - id: st-1
                    minimumRestPeriodBetweenAllocations: 0
                    minimumRestPeriodBetweenAllocationsInHours: 0
                    minimumHoursForPlanningPeriod: 1
                    maximumHoursForPlanningPeriod: 1
                    maximumTravelTimeToAllocationsInMinutes: 30
                  locations:
                  - id: loc-1
                    latitude: 51.5072
                    longitude: 0.1276
                  sharedAttributes:
                  - id: sh-attr-1
                    allocations:
                    - alloc-1
                    attributeId: attr-1
                    minimumQuantity: 3
                  schedulingPeriod:
                    start: '2022-01-26T09:00:00Z'
                    end: '2022-01-30T23:00:00Z'
                  fairnessBuckets: []
                  timezone: UTC
                  meta:
                    key: value
                  solver: arc
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                required:
                - result
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/SolveResult'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
      tags:
      - Solve
