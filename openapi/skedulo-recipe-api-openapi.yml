  /recipe/{recipeId}/default:
    put:
      summary: Set the default recipe for a tenant
      description: Designates the specified recipe as the default for the authenticated tenant. When no explicit recipe is provided at the time of scheduling, this recipe's settings will be used.
      operationId: Set default recipe
      parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - result
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/RecipeRecordShape'
              example:
                result:
                  default: true
                  setAsDefaultBy:
                    userId: user-1
                    vendorUserId: vendor-user-1
                  setAsDefaultAt: '2022-12-31T17:29:00Z'
                  system: true
                  id: a52a74c0-8d9e-4e4a-bce9-2d49d66517d7
                  name: Least travel
                  description: Minimize travel time
                  status: active
                  objectiveWeights:
                    preferredResources: 10
                    minimizeDisruption: 10
                    travelTime: 75
                    softSkills: 5
                    jobsPriority: 10
                  options:
                    ignoreTravelTime: false
                    ignoreTravelTimeFirstJob: false
                    ignoreTravelTimeLastJob: false
                    respectAllocationTimes: false
                    respectAllocationTimesOverTimeConstraints: false
                    respectSchedule: false
                    transformers: []
                    ignoreResourceOverrideLocations: false
                    allowPartiallyAllocatedJobs: true
                    allowPartiallyAllocatedJobDependencies: true
                  createdAt: '2024-01-26T23:00:00Z'
                  modifiedAt: '2024-01-26T23:00:00Z'
                  createdBy:
                    userId: skedulo
                  modifiedBy:
                    userId: skedulo
      security:
      - httpAuth: []
      tags:
      - Recipe
  /recipe/default:
    get:
      summary: Get the default recipe of the tenant
      description: Returns the recipe currently set as the default for the authenticated tenant. Returns 204 No Content if no default recipe has been configured.
      operationId: Get Default Recipe
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - result
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/RecipeRecordShape'
              example:
                result:
                  default: true
                  setAsDefaultBy:
                    userId: user-1
                    vendorUserId: vendor-user-1
                  setAsDefaultAt: '2022-12-31T17:29:00Z'
                  system: true
                  id: a52a74c0-8d9e-4e4a-bce9-2d49d66517d7
                  name: Least travel
                  description: Minimize travel time
                  status: active
                  objectiveWeights:
                    preferredResources: 10
                    minimizeDisruption: 10
                    travelTime: 75
                    softSkills: 5
                    jobsPriority: 10
                  options:
                    ignoreTravelTime: false
                    ignoreTravelTimeFirstJob: false
                    ignoreTravelTimeLastJob: false
                    respectAllocationTimes: false
                    respectAllocationTimesOverTimeConstraints: false
                    respectSchedule: false
                    transformers: []
                    ignoreResourceOverrideLocations: false
                    allowPartiallyAllocatedJobs: true
                    allowPartiallyAllocatedJobDependencies: true
                  createdAt: '2024-01-26T23:00:00Z'
                  modifiedAt: '2024-01-26T23:00:00Z'
                  createdBy:
                    userId: skedulo
                  modifiedBy:
                    userId: skedulo
        '204':
          description: No default recipe fot tenant
      security:
      - httpAuth: []
      tags:
      - Recipe
components:
  schemas:
    UserIdsShape:
      oneOf:
      - $ref: '#/components/schemas/InternalAdminUserId'
      - $ref: '#/components/schemas/VendorUserIds'
    Paging:
      required:
      - limit
      type: object
      properties:
        limit:
          type: integer
          format: int32
        nextCursor:
          type: string
        total:
          type: integer
          format: int32
    VendorUserRecipeRequestShape:
      required:
      - name
      - description
      - objectiveWeights
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        objectiveWeights:
          $ref: '#/components/schemas/ObjectiveWeightsShape'
        options:
          $ref: '#/components/schemas/RecipeOptionsShape'
    RecipeOptionsShape:
      required:
      - ignoreTravelTime
      - ignoreTravelTimeFirstJob
      - ignoreTravelTimeLastJob
      - respectAllocationTimes
      - respectAllocationTimesOverTimeConstraints
      - respectSchedule
      - allowPartiallyAllocatedJobs
      - allowPartiallyAllocatedJobDependencies
      type: object
      properties:
        ignoreTravelTime:
          type: boolean
        ignoreTravelTimeFirstJob:
          type: boolean
        ignoreTravelTimeLastJob:
          type: boolean
        maxDailyTravelTimeInMinutes:
          type: integer
          format: int64
        maxTravelTimeBetweenLocations:
          type: integer
          format: int64
        respectAllocationTimes:
          type: boolean
        respectAllocationTimesOverTimeConstraints:
          type: boolean
        respectSchedule:
          type: boolean
        snapUnit:
          type: integer
          format: int32
        padding:
          type: integer
          format: int32
        allowPartiallyAllocatedJobs:
          type: boolean
        allowPartiallyAllocatedJobDependencies:
          type: boolean
        onJobRemoval:
          type: array
          items:
            type: string
            enum:
            - clearJobTimes
            - deallocateResources
          minItems: 1
        rollingScheduleWindowInterval:
          description: The interval used to split the schedule window into rolling sub-windows. Accepts "monthly", "quarterly", or a positive integer representing a fixed number of days.
    ObjectiveWeightsShape:
      type: object
      properties:
        minimizeDisruption:
          type: integer
        balanceAbsoluteWorkload:
          type: integer
        travelTime:
          type: integer
        minimizeResources:
          type: integer
        softSkills:
          type: integer
        jobsPriority:
          type: integer
        resourceRating:
          type: integer
        scheduleImmediacy:
          type: integer
        urgency:
          type: integer
        overtime:
          type: integer
    VendorUserIds:
      required:
      - userId
      - vendorUserId
      type: object
      properties:
        userId:
          type: string
        vendorUserId:
          type: string
    InternalAdminUserId:
      required:
      - userId
      type: object
      properties:
        userId:
          type: string
    RecipeRecordShape:
      required:
      - id
      - name
      - description
      - status
      - system
      - objectiveWeights
      - options
      - createdAt
      - default
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - active
          - archived
        system:
          type: boolean
        tenantId:
          type: string
        objectiveWeights:
          $ref: '#/components/schemas/ObjectiveWeightsShape'
        options:
          $ref: '#/components/schemas/RecipeOptionsShape'
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/UserIdsShape'
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          $ref: '#/components/schemas/UserIdsShape'
        default:
          type: boolean
        setAsDefaultBy:
          $ref: '#/components/schemas/UserIdsShape'
        setAsDefaultAt:
          type: string
          format: date-time
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
