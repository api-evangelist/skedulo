aid: skedulo
name: Skedulo
description: Skedulo is the Deskless Productivity Cloud, a field service and mobile workforce management
  platform used by enterprises to schedule, dispatch, optimize, and track deskless workers. Its developer
  platform exposes 21 REST services (scheduling, availability, optimization, rules, notifications, resource
  tracking, geoservices, files, configuration, onboarding and more) plus a full GraphQL API, webhooks
  and triggered actions for real-time events, a `sked` CLI, first-party SDKs and UI components, and an
  MCP server. Authentication is via Bearer JWT API tokens, with regional API hosts for the US, AU, UK
  and CA. Backed by SoftBank Vision Fund.
accessModel:
  pricing: unknown
  onboarding: self-serve
  trial: false
  try_now: false
